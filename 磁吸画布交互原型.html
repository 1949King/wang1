<script>
// ============================================================
//  磁吸画布原型 — 核心逻辑
// ============================================================

const state = {
  cards: [],
  selectedId: null,
  draggingId: null,
  magneticMode: true,
  dragStartPos: { x: 0, y: 0 },
  dragOffset: { x: 0, y: 0 },
  lastDragTime: 0,
  lastDragPos: { x: 0, y: 0 },
  dragVelocity: { x: 0, y: 0 },
  magLevel: 'none',
  magTargetId: null,
  magDirection: null,
  cardIdCounter: 0,
};

// 磁吸配置
const MAG_CONFIG = {
  weakDistance: 70,
  mediumDistance: 45,
  strongDistance: 25,
  snapDistance: 15,
  escapeVelocity: 600, // px/s
};

// 卡片类型定义
const CARD_TYPES = {
  shot: {
    icon: '🎬',
    title: '镜头',
    defaultTitle: '新镜头',
    defaultBody: '一个电影感的镜头…',
    tags: ['生图', '生视频'],
    preview: '🎞️',
  },
  script: {
    icon: '📝',
    title: '剧本',
    defaultTitle: '新剧本',
    defaultBody: '这是一段剧本描述…',
    tags: ['文本'],
    preview: '📜',
  },
  prompt: {
    icon: '🎨',
    title: '风格',
    defaultTitle: '风格提示',
    defaultBody: '电影感、赛博朋克…',
    tags: ['提示词'],
    preview: '🎭',
  },
  character: {
    icon: '🧑',
    title: '角色',
    defaultTitle: '角色设定',
    defaultBody: '主角的外貌特征…',
    tags: ['一致性'],
    preview: '👤',
  },
  image: {
    icon: '🖼️',
    title: '图片',
    defaultTitle: '参考图',
    defaultBody: '点击上传参考图',
    tags: ['参考'],
    preview: '🖼️',
  },
  config: {
    icon: '⚙️',
    title: '配置',
    defaultTitle: '生成配置',
    defaultBody: '模型 / 步数 / 风格',
    tags: ['全局'],
    preview: '⚙️',
  },
};

// 空间方向语义映射
const DIRECTION_SEMANTICS = {
  left: { label: '输入 · 参考', color: '#22d3ee' },
  right: { label: '输出 · 后续', color: '#4ade80' },
  top: { label: '并行 · 对照', color: '#fbbf24' },
  bottom: { label: '分支 · 备注', color: '#f87171' },
  stack: { label: '版本 · 层叠', color: '#c084fc' },
};

// ============================================================
//  初始化
// ============================================================

function init() {
  // 初始放两张卡片做演示
  addCard('script', 150, 180, '开场剧本', '夜色笼罩的城市，霓虹灯光在雨中闪烁…');
  addCard('shot', 450, 180, '开场镜头', '电影感城市夜景，雨滴划过镜头');
  updateCardCount();
  updateEmptyHint();
}

// ============================================================
//  卡片创建
// ============================================================

function addCard(type, x, y, title, body) {
  const typeDef = CARD_TYPES[type];
  const id = `card_${++state.cardIdCounter}`;
  const card = {
    id,
    type,
    x,
    y,
    title: title || typeDef.defaultTitle,
    body: body || typeDef.defaultBody,
    status: 'idle',
    layers: [{ id: 'layer_1', version: 1, active: true }],
    activeLayer: 0,
  };
  state.cards.push(card);
  renderCard(card);
  updateCardCount();
  updateEmptyHint();
  return card;
}

function renderCard(card) {
  const typeDef = CARD_TYPES[card.type];
  const el = document.createElement('div');
  el.className = `card ${card.type}`;
  el.id = card.id;
  el.style.left = card.x + 'px';
  el.style.top = card.y + 'px';
  el.innerHTML = `
    <div class="stack-indicator" style="display:${card.layers.length > 1 ? 'flex' : 'none'}">${card.layers.length}</div>
    <div class="stack-control">
      <button class="stack-btn" title="上一层">▲</button>
      <button class="stack-btn" title="下一层">▼</button>
      <button class="stack-btn" title="混血">⚡</button>
    </div>
    <div class="card-header">
      <div class="card-icon">${typeDef.icon}</div>
      <div class="card-title">${card.title}</div>
      <div class="card-status status-${card.status}"></div>
    </div>
    <div class="card-body">${card.body}</div>
    <div class="card-preview">${typeDef.preview}</div>
    <div class="card-tags">
      ${typeDef.tags.map(t => `<span class="card-tag">${t}</span>`).join('')}
    </div>
  `;

  // 拖拽
  el.addEventListener('mousedown', (e) => startDrag(e, card.id));
  el.addEventListener('dblclick', (e) => {
    e.stopPropagation();
    selectCard(card.id);
    showToast('双击编辑卡片内容（原型演示）');
  });
  el.addEventListener('click', (e) => {
    e.stopPropagation();
    selectCard(card.id);
  });

  document.getElementById('cardsContainer').appendChild(el);
}

function updateCard(card) {
  const el = document.getElementById(card.id);
  if (!el) return;
  el.style.left = card.x + 'px';
  el.style.top = card.y + 'px';
  const statusDot = el.querySelector('.card-status');
  if (statusDot) {
    statusDot.className = `card-status status-${card.status}`;
  }
}

// ============================================================
//  拖拽 + 磁吸
// ============================================================

function startDrag(e, cardId) {
  if (!state.magneticMode) {
    // 节点模式：简单拖拽
    startSimpleDrag(e, cardId);
    return;
  }

  e.preventDefault();
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;

  state.draggingId = cardId;
  const el = document.getElementById(cardId);
  el.classList.add('dragging');

  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  state.dragOffset.x = e.clientX - canvasRect.left - card.x;
  state.dragOffset.y = e.clientY - canvasRect.top - card.y;
  state.lastDragPos = { x: e.clientX, y: e.clientY };
  state.lastDragTime = performance.now();
  state.dragVelocity = { x: 0, y: 0 };

  selectCard(cardId);

  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', endDrag);
}

function onDrag(e) {
  if (!state.draggingId) return;

  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  const card = state.cards.find(c => c.id === state.draggingId);
  if (!card) return;

  const now = performance.now();
  const dt = now - state.lastDragTime;

  // 计算速度
  if (dt > 0) {
    state.dragVelocity.x = (e.clientX - state.lastDragPos.x) / dt * 1000;
    state.dragVelocity.y = (e.clientY - state.lastDragPos.y) / dt * 1000;
  }
  state.lastDragPos = { x: e.clientX, y: e.clientY };
  state.lastDragTime = now;

  let newX = e.clientX - canvasRect.left - state.dragOffset.x;
  let newY = e.clientY - canvasRect.top - state.dragOffset.y;

  // 磁吸计算
  const magResult = computeMagnetic(card, newX, newY);
  state.magLevel = magResult.level;
  state.magTargetId = magResult.targetId;
  state.magDirection = magResult.direction;

  // 应用磁吸偏移
  if (magResult.level !== 'none' && magResult.targetId) {
    const strength = magResult.level === 'weak' ? 0.15 :
                     magResult.level === 'medium' ? 0.35 : 0.7;
    newX += (magResult.snapX - newX) * strength;
    newY += (magResult.snapY - newY) * strength;
  }

  card.x = Math.max(60, Math.min(newX, canvasRect.width - 220));
  card.y = Math.max(10, Math.min(newY, canvasRect.height - 200));
  updateCard(card);

  // 更新视觉
  updateMagneticVisuals(card, magResult);
  updateStatusBar();
}

function endDrag(e) {
  const card = state.cards.find(c => c.id === state.draggingId);
  const el = state.draggingId ? document.getElementById(state.draggingId) : null;

  // 判断是否强吸附
  if (state.magLevel === 'strong' && state.magTargetId) {
    // 吸附到目标位置
    const target = state.cards.find(c => c.id === state.magTargetId);
    if (target && card) {
      const snapPos = getSnapPosition(target, state.magDirection);
      // 动画吸附
      animateSnap(card, snapPos.x, snapPos.y);
      showToast(`已吸附：${DIRECTION_SEMANTICS[state.magDirection].label}`);
    }
  }

  if (el) el.classList.remove('dragging');

  // 清理
  state.draggingId = null;
  state.magLevel = 'none';
  state.magTargetId = null;

  // 清除视觉
  clearMagneticVisuals();
  updateStatusBar();

  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', endDrag);
}

// 节点模式下的简单拖拽
function startSimpleDrag(e, cardId) {
  e.preventDefault();
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;

  state.draggingId = cardId;
  const el = document.getElementById(cardId);
  el.classList.add('dragging');

  const canvasRect = document.getElementById('canvas').getBoundingClientRect();
  state.dragOffset.x = e.clientX - canvasRect.left - card.x;
  state.dragOffset.y = e.clientY - canvasRect.top - card.y;

  selectCard(cardId);

  function onSimpleDrag(ev) {
    card.x = ev.clientX - canvasRect.left - state.dragOffset.x;
    card.y = ev.clientY - canvasRect.top - state.dragOffset.y;
    updateCard(card);
  }
  function endSimpleDrag() {
    el.classList.remove('dragging');
    state.draggingId = null;
    document.removeEventListener('mousemove', onSimpleDrag);
    document.removeEventListener('mouseup', endSimpleDrag);
  }
  document.addEventListener('mousemove', onSimpleDrag);
  document.addEventListener('mouseup', endSimpleDrag);
}

// ============================================================
//  磁吸计算核心
// ============================================================

function computeMagnetic(draggingCard, dragX, dragY) {
  let bestLevel = 'none';
  let bestTarget = null;
  let bestDirection = null;
  let bestDist = Infinity;
  let snapX = dragX;
  let snapY = dragY;

  for (const other of state.cards) {
    if (other.id === draggingCard.id) continue;

    const dx = (other.x + 100) - (dragX + 100);
    const dy = (other.y + 100) - (dragY + 100);
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist > MAG_CONFIG.weakDistance) continue;

    // 判断方向
    const direction = getDirection(dx, dy, other, draggingCard);

    // 计算磁吸等级
    let level = 'none';
    if (dist < MAG_CONFIG.strongDistance) level = 'strong';
    else if (dist < MAG_CONFIG.mediumDistance) level = 'medium';
    else if (dist < MAG_CONFIG.weakDistance) level = 'weak';

    if (level !== 'none' && dist < bestDist) {
      bestLevel = level;
      bestTarget = other.id;
      bestDirection = direction;
      bestDist = dist;
      const pos = getSnapPosition(other, direction);
      snapX = pos.x;
      snapY = pos.y;
    }
  }

  return {
    level: bestLevel,
    targetId: bestTarget,
    direction: bestDirection,
    snapX,
    snapY,
    distance: bestDist,
  };
}

function getDirection(dx, dy, targetCard, sourceCard) {
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);

  // 判断是否层叠（基本重叠）
  if (absDx < 60 && absDy < 40) {
    return 'stack';
  }

  // 水平方向主导
  if (absDx > absDy) {
    return dx > 0 ? 'right' : 'left';
  } else {
    return dy > 0 ? 'bottom' : 'top';
  }
}

function getSnapPosition(targetCard, direction) {
  const cardW = 200;
  const cardH = 200;
  const gap = 30;

  switch (direction) {
    case 'left':   return { x: targetCard.x - cardW - gap, y: targetCard.y };
    case 'right':  return { x: targetCard.x + cardW + gap, y: targetCard.y };
    case 'top':    return { x: targetCard.x, y: targetCard.y - cardH - gap };
    case 'bottom': return { x: targetCard.x, y: targetCard.y + cardH + gap };
    case 'stack':  return { x: targetCard.x + 8, y: targetCard.y + 8 };
    default:       return { x: targetCard.x, y: targetCard.y };
  }
}

// ============================================================
//  磁吸视觉效果
// ============================================================

function updateMagneticVisuals(draggingCard, magResult) {
  const dragEl = document.getElementById(draggingCard.id);
  const targetEl = magResult.targetId ? document.getElementById(magResult.targetId) : null;

  // 拖拽卡片的磁吸状态类
  dragEl.classList.remove('mag-weak', 'mag-medium', 'mag-strong');
  if (magResult.level !== 'none') {
    dragEl.classList.add(`mag-${magResult.level}`);
  }

  // 目标卡片高亮
  document.querySelectorAll('.card.mag-target').forEach(el => el.classList.remove('mag-target'));
  if (targetEl && magResult.level !== 'none') {
    targetEl.classList.add('mag-target');
  }

  // 吸附目标框
  const snapTarget = document.getElementById('snapTarget');
  if (magResult.level !== 'none' && magResult.targetId) {
    snapTarget.style.left = magResult.snapX + 'px';
    snapTarget.style.top = magResult.snapY + 'px';
    snapTarget.style.width = '196px';
    snapTarget.style.height = '196px';
    snapTarget.classList.add('visible');
  } else {
    snapTarget.classList.remove('visible');
  }

  // 方向标签
  const dirLabel = document.getElementById('dirLabel');
  if (magResult.direction && magResult.level !== 'none') {
    const sem = DIRECTION_SEMANTICS[magResult.direction];
    dirLabel.textContent = sem.label;
    dirLabel.style.background = sem.color;
    dirLabel.style.color = '#0f1115';
    dirLabel.style.left = (magResult.snapX + 100) + 'px';
    dirLabel.style.top = (magResult.snapY - 24) + 'px';
    dirLabel.style.transform = 'translateX(-50%)';
    dirLabel.classList.add('visible');
  } else {
    dirLabel.classList.remove('visible');
  }

  // 磁力线
  drawMagneticLines(draggingCard, magResult);
}

function clearMagneticVisuals() {
  document.querySelectorAll('.card.mag-weak, .card.mag-medium, .card.mag-strong, .card.mag-target')
    .forEach(el => el.classList.remove('mag-weak', 'mag-medium', 'mag-strong', 'mag-target'));
  document.getElementById('snapTarget').classList.remove('visible');
  document.getElementById('dirLabel').classList.remove('visible');
  document.getElementById('magLines').innerHTML = `
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;
}

function drawMagneticLines(draggingCard, magResult) {
  const svg = document.getElementById('magLines');
  svg.innerHTML = `
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>`;

  if (!magResult.targetId || magResult.level === 'none') return;

  const target = state.cards.find(c => c.id === magResult.targetId);
  if (!target) return;

  const x1 = draggingCard.x + 100;
  const y1 = draggingCard.y + 100;
  const x2 = target.x + 100;
  const y2 = target.y + 100;

  // 曲线控制点
  const midX = (x1 + x2) / 2;
  const midY = (y1 + y2) / 2 - 20;

  const color = magResult.level === 'strong' ? '#c084fc' : '#22d3ee';
  const opacity = magResult.level === 'strong' ? 0.9 :
                  magResult.level === 'medium' ? 0.6 : 0.3;
  const strokeWidth = magResult.level === 'strong' ? 3 :
                      magResult.level === 'medium' ? 2 : 1;

  const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  path.setAttribute('d', `M ${x1} ${y1} Q ${midX} ${midY} ${x2} ${y2}`);
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', strokeWidth);
  path.setAttribute('fill', 'none');
  path.setAttribute('opacity', opacity);
  path.setAttribute('filter', 'url(#glow)');
  path.setAttribute('stroke-dasharray', magResult.level === 'strong' ? 'none' : '6 4');
  svg.appendChild(path);

  // 两端的发光圆点
  [ [x1, y1], [x2, y2] ].forEach(([cx, cy]) => {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', cx);
    circle.setAttribute('cy', cy);
    circle.setAttribute('r', magResult.level === 'strong' ? 6 : 4);
    circle.setAttribute('fill', color);
    circle.setAttribute('filter', 'url(#glow)');
    circle.setAttribute('opacity', opacity);
    svg.appendChild(circle);
  });
}

// ============================================================
//  吸附动画
// ============================================================

function animateSnap(card, targetX, targetY) {
  const startX = card.x;
  const startY = card.y;
  const duration = 180;
  const startTime = performance.now();

  function step(now) {
    const t = Math.min((now - startTime) / duration, 1);
    // spring 缓动：过冲一点再回弹
    const eased = t < 0.5
      ? 4 * t * t * t
      : 1 - Math.pow(-2 * t + 2, 3) / 2;

    // 加一点过冲
    const overshoot = t < 0.7 ? 0 : Math.sin((t - 0.7) * Math.PI / 0.3) * -3;

    card.x = startX + (targetX - startX) * eased + overshoot;
    card.y = startY + (targetY - startY) * eased + overshoot;
    updateCard(card);

    if (t < 1) {
      requestAnimationFrame(step);
    }
  }
  requestAnimationFrame(step);
}

// ============================================================
//  选中 & 检视面板
// ============================================================

function selectCard(cardId) {
  state.selectedId = cardId;
  const card = state.cards.find(c => c.id === cardId);

  // 更新选中样式
  document.querySelectorAll('.card').forEach(el => {
    el.style.outline = '';
    el.style.outlineOffset = '';
  });
  const el = document.getElementById(cardId);
  if (el) {
    el.style.outline = '2px solid #c084fc';
    el.style.outlineOffset = '2px';
  }

  // 显示浮动工具条
  showFloatToolbar(card);

  // 更新检视面板
  updateInspector(card);
}

function showFloatToolbar(card) {
  const toolbar = document.getElementById('floatToolbar');
  toolbar.classList.add('visible');
  toolbar.style.left = (card.x + 100 - 70) + 'px';
  toolbar.style.top = (card.y - 42) + 'px';
}

function updateInspector(card) {
  const typeDef = CARD_TYPES[card.type];
  const content = document.getElementById('inspectorContent');
  content.innerHTML = `
    <div class="inspector-field">
      <label>标题</label>
      <input type="text" value="${card.title}" onchange="updateCardField('title', this.value)">
    </div>
    <div class="inspector-field">
      <label>描述</label>
      <textarea onchange="updateCardField('body', this.value)">${card.body}</textarea>
    </div>
    <div class="inspector-field">
      <label>质量档位</label>
      <div class="quality-tags">
        <div class="quality-tag active">草稿</div>
        <div class="quality-tag">标准</div>
        <div class="quality-tag">电影</div>
      </div>
    </div>
    <div class="inspector-field">
      <label>相似度</label>
      <input type="range" min="0" max="100" value="70" oninput="this.nextElementSibling.textContent = this.value + '%'">
      <div class="value-display">70%</div>
    </div>
    <div class="inspector-field">
      <label>时长</label>
      <input type="range" min="1" max="15" value="3" oninput="this.nextElementSibling.textContent = this.value + ' 秒'">
      <div class="value-display">3 秒</div>
    </div>
    <div class="inspector-field">
      <label>状态</label>
      <select onchange="updateCardStatus(this.value)">
        <option value="idle">待执行</option>
        <option value="generating">生成中</option>
        <option value="success">成功</option>
        <option value="failed">失败</option>
      </select>
    </div>
  `;
}

function updateCardField(field, value) {
  const card = state.cards.find(c => c.id === state.selectedId);
  if (!card) return;
  card[field] = value;
  const el = document.getElementById(card.id);
  if (field === 'title') el.querySelector('.card-title').textContent = value;
  if (field === 'body') el.querySelector('.card-body').textContent = value;
}

function updateCardStatus(status) {
  const card = state.cards.find(c => c.id === state.selectedId);
  if (!card) return;
  card.status = status;
  updateCard(card);
}

// ============================================================
//  侧栏拖拽创建
// ============================================================

document.querySelectorAll('.sidebar-item').forEach(item => {
  item.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('cardType', item.dataset.type);
  });
});

const canvas = document.getElementById('canvas');
canvas.addEventListener('dragover', (e) => {
  e.preventDefault();
});
canvas.addEventListener('drop', (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData('cardType');
  if (!type) return;
  const canvasRect = canvas.getBoundingClientRect();
  const x = e.clientX - canvasRect.left - 100;
  const y = e.clientY - canvasRect.top - 100;
  addCard(type, Math.max(60, x), Math.max(10, y));
  showToast(`已创建${CARD_TYPES[type].title}卡片 — 试试拖到其他卡片旁边`);
});

// 点击空白取消选中
canvas.addEventListener('click', (e) => {
  if (e.target === canvas || e.target.id === 'cardsContainer') {
    state.selectedId = null;
    document.querySelectorAll('.card').forEach(el => {
      el.style.outline = '';
      el.style.outlineOffset = '';
    });
    document.getElementById('floatToolbar').classList.remove('visible');
    document.getElementById('inspectorContent').innerHTML =
      '<span style="color:#6b7280;font-size:13px;">选中一张卡片查看详情</span>';
  }
});

// ============================================================
//  工具函数
// ============================================================

function setMode(mode) {
  state.magneticMode = mode === 'magnetic';
  document.querySelectorAll('.mode-switch button').forEach((btn, i) => {
    btn.classList.toggle('active',
      (mode === 'magnetic' && i === 0) || (mode === 'node' && i === 1));
  });
  showToast(mode === 'magnetic' ? '已切换到磁吸模式 — 拖拽卡片感受磁力' : '已切换到节点模式 — 传统连线操作');
}

function resetCanvas() {
  state.cards = [];
  state.selectedId = null;
  state.cardIdCounter = 0;
  document.getElementById('cardsContainer').innerHTML = '';
  clearMagneticVisuals();
  init();
  showToast('画布已重置');
}

function updateCardCount() {
  document.getElementById('cardCount').textContent = state.cards.length;
}

function updateEmptyHint() {
  document.getElementById('emptyHint').style.display =
    state.cards.length === 0 ? 'block' : 'none';
}

function updateStatusBar() {
  const levelEl = document.getElementById('magLevel');
  const hintEl = document.getElementById('hintText');

  const levelMap = {
    none: { text: '无', cls: 'none' },
    weak: { text: '弱', cls: 'weak' },
    medium: { text: '中', cls: 'medium' },
    strong: { text: '强', cls: 'strong' },
  };
  const info = levelMap[state.magLevel];
  levelEl.textContent = info.text;
  levelEl.className = `mag-level ${info.cls}`;

  if (state.draggingId) {
    if (state.magLevel === 'strong') {
      hintEl.textContent = '松开即可吸附';
    } else if (state.magLevel === 'medium') {
      hintEl.textContent = '感受到磁力了…';
    } else if (state.magLevel === 'weak') {
      hintEl.textContent = '靠近其他卡片中…';
    } else {
      hintEl.textContent = '拖拽中';
    }
  } else {
    hintEl.textContent = state.magneticMode
      ? '拖拽卡片感受磁吸'
      : '节点模式：传统连线操作';
  }
}

let toastTimer = null;
function showToast(msg) {
  const toast = document.getElementById('infoToast');
  toast.innerHTML = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 2500);
}

// 浮动工具条按钮
document.querySelectorAll('.float-btn').forEach((btn, i) => {
  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    const actions = ['生成', '复制', '入轨', '删除'];
    showToast(`操作：${actions[i]}（原型演示）`);
  });
});

// 启动
init();
</script>
