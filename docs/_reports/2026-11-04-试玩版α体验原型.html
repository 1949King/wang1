<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光剪影 · 试玩版 α（可体验原型 · 2026-11-04）</title>
<style>
  :root{
    --bg:#0e1014; --win:#15181e; --win2:#1a1e26;
    --card:rgba(255,255,255,.035); --card2:rgba(255,255,255,.06);
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
    --tx:#e9ecf1; --tx2:#9aa3b2; --tx3:#68707e;
    --acc:#6ea8ff; --accbg:rgba(110,168,255,.14);
    --ok:#7ed692; --okbg:rgba(126,214,146,.14);
    --warn:#f5c05a; --warnbg:rgba(245,192,90,.13); --bad:#ff9696; --badbg:rgba(255,150,150,.14);
    --shadow:0 18px 60px rgba(0,0,0,.55);
  }
  [data-theme="light"]{
    --bg:#eef0f4; --win:#ffffff; --win2:#f6f7fa;
    --card:#f7f8fb; --card2:#eef1f6;
    --line:rgba(15,20,30,.10); --line2:rgba(15,20,30,.18);
    --tx:#1b1f27; --tx2:#5a6272; --tx3:#8a92a2;
    --acc:#2f6fd0; --accbg:rgba(47,111,208,.10);
    --ok:#2f8f4e; --okbg:rgba(47,143,78,.12);
    --warn:#a9750d; --warnbg:rgba(169,117,13,.12); --bad:#c33b3b; --badbg:rgba(195,59,59,.10);
    --shadow:0 18px 50px rgba(15,25,45,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--tx); min-height:100vh;
    font:13px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif;
    padding:18px; display:flex; justify-content:center;
  }
  .wrap{width:100%;max-width:1180px}

  /* ── 顶部说明 ── */
  .hint{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:10px 14px; margin-bottom:14px; font-size:12px; color:var(--tx2);
  }
  .hint b{color:var(--tx);font-weight:500}
  .hint .spacer{flex:1}
  .hint button{
    height:26px;padding:0 10px;border-radius:7px;cursor:pointer;font-size:11px;
    border:1px solid var(--line2);background:var(--win2);color:var(--tx2);
  }
  .hint button:hover{color:var(--tx);background:var(--card2)}

  /* ── 模拟程序窗口 ── */
  .app{
    background:var(--win); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; box-shadow:var(--shadow); height:700px;
    display:flex; flex-direction:column;
  }
  .titlebar{
    height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;
    border-bottom:1px solid var(--line); background:var(--win2); flex:0 0 auto;
  }
  .logo{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--acc),#9b7bff)}
  .title{font-size:13px;font-weight:500}
  .ver{font-size:11px;color:var(--tx3)}
  .titlebar .spacer{flex:1}
  .chip{
    height:22px;padding:0 8px;border-radius:6px;font-size:11px;display:inline-flex;align-items:center;
    background:var(--warnbg);color:var(--warn);border:1px solid transparent;
  }
  .chip.ok{background:var(--okbg);color:var(--ok)}

  /* ── 关卡进度条 ── */
  .bar{
    display:flex;align-items:center;gap:0;padding:12px 18px;
    border-bottom:1px solid var(--line); background:var(--win); flex:0 0 auto;
  }
  .bar .st{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3);white-space:nowrap}
  .bar .st .n{
    width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;border:1px solid var(--line2);background:var(--win2);color:var(--tx3);
  }
  .bar .st.on{color:var(--acc)}
  .bar .st.on .n{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
  .bar .st.done{color:var(--ok)}
  .bar .st.done .n{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
  .bar .ln{flex:1;height:1px;background:var(--line);margin:0 10px;min-width:12px}

  /* ── 主体两栏 ── */
  .body{display:flex;flex:1;min-height:0}
  .main{flex:1;padding:22px 24px;overflow:auto;min-width:0}
  .side{
    width:300px;flex:0 0 300px;border-left:1px solid var(--line);
    background:var(--win2);display:flex;flex-direction:column;min-height:0;
  }
  .side h4{
    font-size:11px;font-weight:500;color:var(--tx3);letter-spacing:.04em;
    padding:12px 14px 8px;flex:0 0 auto;
  }
  .logs{flex:1;overflow:auto;padding:0 14px 14px;font:11px/1.7 ui-monospace,Consolas,monospace}
  .logs .row{display:flex;gap:8px;color:var(--tx2);border-bottom:1px dashed var(--line);padding:3px 0}
  .logs .row .t{color:var(--tx3);flex:0 0 40px}
  .logs .row .c{color:var(--acc);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logs .row.warn .c{color:var(--warn)}
  .logs .row.bad .c{color:var(--bad)}
  .logs .row.ok .c{color:var(--ok)}
  .logs .empty{color:var(--tx3);font-size:11px;padding:6px 0}
  .side .foot{
    flex:0 0 auto;padding:10px 14px;border-top:1px solid var(--line);
    font-size:11px;color:var(--tx3);line-height:1.6;
  }

  /* ── 关卡内容 ── */
  .h1{font-size:16px;font-weight:500;margin-bottom:5px}
  .sub{font-size:12px;color:var(--tx3);margin-bottom:18px;line-height:1.7}
  .sub b{color:var(--tx2);font-weight:500}
  .card{
    border:1px solid var(--line);background:var(--card);border-radius:12px;
    padding:16px;margin-bottom:14px;
  }
  .card .t{font-size:12px;color:var(--tx2);margin-bottom:10px}
  .card .t b{color:var(--tx);font-weight:500}
  .btns{display:flex;gap:9px;flex-wrap:wrap}
  .btn{
    height:32px;padding:0 14px;border-radius:8px;cursor:pointer;font-size:12px;
    border:1px solid var(--line2);background:var(--card2);color:var(--tx);
  }
  .btn:hover{border-color:var(--acc);color:var(--acc)}
  .btn.primary{background:var(--accbg);border-color:var(--acc);color:var(--acc);font-weight:500}
  .btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line2);color:var(--tx3)}
  .btn.ghost{background:transparent}

  /* 体检 */
  .chk{display:flex;flex-direction:column;gap:9px}
  .chk .it{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;
    border:1px solid var(--line);background:var(--win2);font-size:12px;
  }
  .chk .it .k{width:112px;color:var(--tx3);flex:0 0 auto}
  .chk .it .v{color:var(--tx);flex:1}
  .chk .it .r{font-size:11px;color:var(--ok)}
  .chk .it.warn .r{color:var(--warn)}
  .chk .it.bad .r{color:var(--bad)}

  /* 进度 */
  .pg{margin-top:12px}
  .pg .track{height:5px;border-radius:3px;background:var(--card2);overflow:hidden}
  .pg .fill{height:100%;background:linear-gradient(90deg,var(--acc),#9b7bff);transition:width .35s ease}
  .pg .lab{font-size:11px;color:var(--tx3);margin-top:7px}

  /* 生成结果 */
  .shot{
    position:relative;border-radius:10px;overflow:hidden;aspect-ratio:16/9;
    background:linear-gradient(135deg,#243046,#3a2a48 55%,#1d2a35);
    display:flex;align-items:center;justify-content:center;
  }
  .shot .ph{color:rgba(255,255,255,.32);font-size:12px}
  .shot.busy .ph{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:.9}}
  .shot .tag{
    position:absolute;left:8px;top:8px;height:20px;padding:0 7px;border-radius:5px;
    font-size:10px;display:inline-flex;align-items:center;
    background:rgba(0,0,0,.55);color:#fff;backdrop-filter:blur(4px);
  }
  .shot .wm{
    position:absolute;right:10px;bottom:10px;font-size:11px;color:rgba(255,255,255,.62);
    letter-spacing:.16em;
  }
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--tx3);margin-top:9px}
  .meta b{color:var(--tx2);font-weight:500}

  /* 时间线（第 2 关） */
  .tl{
    display:flex;gap:8px;align-items:center;padding:12px;border-radius:10px;
    border:1px dashed var(--line2);background:var(--win2);min-height:74px;flex-wrap:wrap;
  }
  .clip{
    width:86px;height:50px;border-radius:8px;border:1px solid var(--line2);
    background:linear-gradient(135deg,#2b3a52,#3d2f4d);position:relative;
    display:flex;align-items:center;justify-content:center;font-size:10px;color:rgba(255,255,255,.6);
    cursor:pointer;
  }
  .clip.on{outline:2px solid var(--acc);outline-offset:1px}
  .clip .idx{position:absolute;left:5px;top:3px;font-size:9px;color:rgba(255,255,255,.55)}
  .add{
    width:44px;height:50px;border-radius:8px;border:1px dashed var(--line2);
    display:flex;align-items:center;justify-content:center;color:var(--tx3);
    cursor:pointer;font-size:17px;background:transparent;
  }
  .add:hover{border-color:var(--acc);color:var(--acc)}

  /* 3D（第 3 关） */
  .stage3d{
    height:210px;border-radius:10px;border:1px solid var(--line);
    background:radial-gradient(ellipse at 50% 35%,#233042,#12161d 70%);
    display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;
    perspective:700px;
  }
  .figure{
    width:44px;height:100px;position:relative;transition:transform .5s ease;
    transform-style:preserve-3d;
  }
  .figure .head{width:24px;height:24px;border-radius:50%;background:#8b93a3;margin:0 auto 3px}
  .figure .torso{width:38px;height:44px;border-radius:9px;background:#7b8496;margin:0 auto 3px}
  .figure .legs{width:34px;height:30px;border-radius:7px;background:#6c7585;margin:0 auto}
  .stage3d .floor{
    position:absolute;left:50%;bottom:34px;width:250px;height:52px;margin-left:-125px;
    border-radius:50%;background:radial-gradient(ellipse,rgba(110,168,255,.16),transparent 70%);
  }
  .cams{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .cams button{
    height:28px;padding:0 11px;border-radius:7px;cursor:pointer;font-size:11px;
    border:1px solid var(--line2);background:transparent;color:var(--tx2);
  }
  .cams button:hover{border-color:var(--acc);color:var(--acc)}
  .cams button.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}

  /* 结束页 */
  .end-head{text-align:center;padding:10px 0 18px}
  .end-head .big{font-size:19px;font-weight:500;margin-bottom:6px}
  .end-head p{font-size:12px;color:var(--tx3)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--tx3);font-weight:500;font-size:11px}
  td:first-child{color:var(--tx2);width:34%}
  td.a{color:var(--tx2)}
  td.b{color:var(--tx)}
  .tagb{color:var(--warn)}
  .question{margin-bottom:14px}
  .question .q{font-size:12px;margin-bottom:8px;color:var(--tx)}
  .opts{display:flex;gap:8px;flex-wrap:wrap}
  .opt{
    padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:transparent;
    font-size:12px;color:var(--tx2);cursor:pointer;
  }
  .opt:hover{border-color:var(--acc);color:var(--acc)}
  .opt.on{background:var(--accbg);border-color:var(--acc);color:var(--acc)}
  .note{font-size:11px;color:var(--tx3);margin-top:10px;line-height:1.7}
  .note b{color:var(--tx2);font-weight:500}

  @media (max-width:860px){
    .side{display:none}
    .app{height:auto;min-height:620px}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hint">
    <b>试玩版 α</b>
    <span>这不是产品截图，是可以点着走一遍的体验原型 —— 4 个关卡，每关都对应仓库里真实存在的能力。</span>
    <span class="spacer"></span>
    <button onclick="reset()">重玩</button>
    <button onclick="toggleTheme()">换主题</button>
  </div>

  <div class="app">
    <div class="titlebar">
      <div class="logo"></div>
      <div class="title">拾光剪影</div>
      <div class="ver">试玩版 alpha · 限时体验</div>
      <div class="spacer"></div>
      <span class="chip" id="chip">试玩中 · 导出带水印</span>
    </div>

    <div class="bar" id="bar"></div>

    <div class="body">
      <div class="main" id="main"></div>
      <div class="side">
        <h4>这次试玩采集到了什么</h4>
        <div class="logs" id="logs"></div>
        <div class="foot" id="foot">
          真实版本里这里记的是：启动成功率、显存不足占比、从打开到第一条片的秒数、退出在哪一步。
        </div>
      </div>
    </div>
  </div>

</div>

<script>
/* ═══════════════════════════════════════════════════════════
   状态
   ═══════════════════════════════════════════════════════════ */
var T0 = performance.now();
var SESS = 0;     // 会话号：点「重玩」会 +1，旧的生成定时器据此自行退出
var S = {
  step: 0,        // 0 体检 · 1 图生视频 · 2 三镜成段 · 3 机位 · 4 结束
  busy: false,
  prog: 0,
  cur: '',
  logs: [],
  vram: 8,
  clips: [],
  sel: -1,
  cam: '',
  answers: {},
  done: {}        // 每关完成标记
};

var STEPS = ['启动体检', '让一张图动起来', '三个镜头连成一段', '定一个机位', '试玩结束'];

function log(code, kind, detail) {
  var t = ((performance.now() - T0) / 1000).toFixed(1);
  S.logs.push({ t: t, code: code, kind: kind || '', detail: detail || '' });
}

function elapsed() { return ((performance.now() - T0) / 1000).toFixed(0); }

/* ═══════════════════════════════════════════════════════════
   渲染
   ═══════════════════════════════════════════════════════════ */
function render() {
  renderBar();
  renderMain();
  renderLogs();
  document.getElementById('chip').className = 'chip' + (S.step >= 4 ? ' ok' : '');
  document.getElementById('chip').textContent = S.step >= 4 ? '试玩结束 · 成片已导出' : '试玩中 · 导出带水印';
}

function renderBar() {
  var h = '';
  for (var i = 0; i < STEPS.length; i++) {
    var cls = 'st';
    if (i < S.step) cls += ' done';
    if (i === S.step) cls += ' on';
    h += '<div class="' + cls + '"><span class="n">' + (i < S.step ? '✓' : (i + 1)) + '</span>' + STEPS[i] + '</div>';
    if (i < STEPS.length - 1) h += '<div class="ln"></div>';
  }
  document.getElementById('bar').innerHTML = h;
}

function renderLogs() {
  var el = document.getElementById('logs');
  if (!S.logs.length) {
    el.innerHTML = '<div class="empty">还没有数据。点上面任意按钮，这里会实时记下来。</div>';
    return;
  }
  var h = '';
  for (var i = S.logs.length - 1; i >= 0; i--) {
    var r = S.logs[i];
    h += '<div class="row ' + r.kind + '"><span class="t">' + r.t + 's</span><span class="c">' + r.code +
         (r.detail ? ' · ' + r.detail : '') + '</span></div>';
  }
  el.innerHTML = h;
}

function renderMain() {
  var el = document.getElementById('main');
  if (S.step === 0) el.innerHTML = viewCheck();
  else if (S.step === 1) el.innerHTML = viewL1();
  else if (S.step === 2) el.innerHTML = viewL2();
  else if (S.step === 3) el.innerHTML = viewL3();
  else el.innerHTML = viewEnd();
}

/* ── 第 0 关：启动体检 ───────────────────────────── */
function viewCheck() {
  var v = S.vram;
  var lvl = v >= 12 ? '' : (v >= 8 ? 'warn' : 'bad');
  var advice = v >= 12 ? '可以跑满：出图 + 视频 + 3D 同时开'
             : v >= 8 ? '能跑，但别同时开两个大模型 —— 会掉到内存里，慢十倍'
             : '只能出图。视频请换机器，或降到 512 分辨率';

  return '<div class="h1">先看看你这台机器撑不撑得住</div>' +
    '<div class="sub">真实产品里这一步在<b>第一次启动就自动跑完</b>，不需要你懂显存。<br>' +
    '80% 的「装了打不开 / 一跑就崩 / 卡死」都是这里能提前说清楚的。</div>' +

    '<div class="card"><div class="t">硬件自检结果</div><div class="chk">' +
      '<div class="it"><span class="k">显卡</span><span class="v">NVIDIA GeForce RTX 4060</span><span class="r">识别到</span></div>' +
      '<div class="it"><span class="k">显存</span><span class="v">' + v + ' GB</span><span class="r ' + (lvl || '') + '">' +
        (v >= 12 ? '够用' : (v >= 8 ? '偏紧' : '不足')) + '</span></div>' +
      '<div class="it"><span class="k">CUDA / 驱动</span><span class="v">12.4 · 551.86</span><span class="r">兼容</span></div>' +
      '<div class="it ' + (lvl || '') + '"><span class="k">模型文件</span><span class="v">3 个内核就绪 · 1 个待下载（2.1 GB）</span><span class="r ' + (lvl || '') + '">' +
        (v >= 12 ? '齐了' : '先不装') + '</span></div>' +
      '<div class="it"><span class="k">磁盘余量</span><span class="v">186 GB</span><span class="r">充足</span></div>' +
    '</div>' +
    '<div class="note" style="margin-top:12px"><b>给你的建议：</b>' + advice + '</div>' +
    '</div>' +

    '<div class="card"><div class="t">换一张卡看看体检怎么说</div><div class="btns">' +
      '<button class="btn" onclick="setVram(6)">6 GB（笔记本）</button>' +
      '<button class="btn" onclick="setVram(8)">8 GB（主流）</button>' +
      '<button class="btn" onclick="setVram(16)">16 GB（工作站）</button>' +
    '</div></div>' +

    '<div class="btns" style="margin-top:4px">' +
      '<button class="btn primary" onclick="startTrial()">' + (S.done.check ? '继续' : '开始试玩（约 3 分钟）') + '</button>' +
      '<button class="btn ghost" onclick="skipToEnd()">直接看结论</button>' +
    '</div>';
}

function setVram(n) {
  S.vram = n;
  log('boot.vram_gb', n >= 12 ? 'ok' : (n >= 8 ? 'warn' : 'bad'), n + 'G');
  render();
}

function startTrial() {
  if (!S.done.check) {
    log('boot.ok', 'ok', '自检通过 · 用时 1.8s');
    S.done.check = 1;
  }
  S.step = 1;
  log('flow.enter', '', 'L1 图生视频');
  render();
}

function skipToEnd() {
  if (!S.done.check) { log('boot.ok', 'ok', '自检跳过'); S.done.check = 1; }
  log('flow.skip', 'warn', '试玩者直接跳过全部关卡');
  S.step = 4;
  render();
}

/* ── 第 1 关：让一张图动起来 ─────────────────────── */
function viewL1() {
  var st = S.done.l1;
  var shot = '<div class="shot' + (S.busy ? ' busy' : '') + '">' +
    (S.busy
      ? '<div class="ph">正在生成…</div><div class="tag">' + S.prog + '%</div>'
      : (st
        ? '<div class="ph" style="font-size:34px;opacity:.5">▶</div><div class="tag">5.0 秒</div><div class="wm">试玩版</div>'
        : '<div class="ph">还没有画面</div>')) +
    '</div>' +
    (S.busy
      ? '<div class="pg"><div class="track"><div class="fill" style="width:' + S.prog + '%"></div></div><div class="lab">' + S.cur + '</div></div>'
      : (st
        ? '<div class="meta"><span>分辨率 <b>720p</b></span><span>时长 <b>5.0 秒</b></span><span>帧率 <b>24</b></span><span>带水印 <b>是</b></span></div>'
        : ''));

  return '<div class="h1">第 1 关 · 让一张图动起来</div>' +
    '<div class="sub">这关验证的是<b>最短成功路径</b>：从打开软件到手里有一条能发出去的片，要多久。<br>' +
    '真实产品里：出图走 SDXL 内核，图生视频走 SVD 内核，两个都在你本机跑，不上传任何东西。</div>' +

    '<div class="card"><div class="t">任务：出一张图，再让它动 5 秒</div>' + shot +
      '<div class="btns" style="margin-top:13px">' +
        '<button class="btn primary" onclick="runL1()" ' + (S.busy || st ? 'disabled' : '') + '>' +
          (st ? '已完成' : (S.busy ? '生成中…' : '开始生成')) + '</button>' +
        (st ? '<button class="btn" onclick="nextFromL1()">下一关</button>' : '') +
        (st ? '<button class="btn ghost" onclick="log(\'export.click\',\'warn\',\'试玩版导出的片子带角标\')">导出这条片</button>' : '') +
      '</div>' +
    '</div>' +

    '<div class="card"><div class="t">这一关要回答的问题</div>' +
      '<div class="note" style="margin-top:0">' +
        '① 从点按钮到看见第一帧，你等了多久？<b>超过 60 秒大多数人不等了</b>。<br>' +
        '② 中间没有进度、没有解释的时候，你会不会以为它卡死了？<br>' +
        '③ 出片质量低于你的预期时，你知道该改什么吗（提示词 / 步数 / 分辨率）？<br>' +
        '这三条是「本地生成」比云端更难受的地方 —— 云端有排队提示，本地只有黑屏。' +
      '</div></div>';
}

function runL1() {
  if (S.busy) return;
  var mySess = SESS;
  var steps = [
    { l: '读提示词，挑模型', c: 'gen.model_pick', d: 'sdxl' },
    { l: '出图（4 步蒸馏）', c: 'gen.image', d: '1024x576 · 4 steps' },
    { l: '切 SVD 内核，准备运动', c: 'gen.switch', d: 'sdxl → svd' },
    { l: '解码 120 帧', c: 'gen.decode', d: '120 帧 · 24fps' },
    { l: '封装 mp4', c: 'gen.wrap', d: '5.0s · 8.4MB' }
  ];
  S.busy = true; S.prog = 0; S.cur = steps[0].l; render();
  var i = 0;
  var timer = setInterval(function () {
    if (mySess !== SESS) { clearInterval(timer); return; }   // 期间点过「重玩」，本轮回调作废
    S.prog = Math.round(((i + 1) / steps.length) * 100);
    S.cur = steps[i].l;
    log(steps[i].c, '', steps[i].d);
    i++;
    if (i >= steps.length) {
      clearInterval(timer);
      S.busy = false;
      S.done.l1 = 1;
      log('l1.first_clip_s', 'ok', elapsed() + 's 拿到第一条片');
      log('l1.watermark_viewed', 'warn', '试玩者看到了水印');
      render();
      return;
    }
    render();
  }, 820);
}

function nextFromL1() { S.step = 2; log('flow.enter', '', 'L2 三镜成段'); render(); }

/* ── 第 2 关：三个镜头连成一段 ───────────────────── */
function viewL2() {
  var h = '';
  for (var i = 0; i < S.clips.length; i++) {
    h += '<div class="clip' + (S.sel === i ? ' on' : '') + '" onclick="pickClip(' + i + ')">' +
         '<span class="idx">' + (i + 1) + '</span>' + S.clips[i].n + '</div>';
  }
  h += '<button class="add" onclick="addClip()" title="加一个镜头">+</button>';

  var joined = S.done.l2;

  return '<div class="h1">第 2 关 · 三个镜头连成一段</div>' +
    '<div class="sub">这关验证的是<b>闭环</b>：市面上大多数工具只占一段 —— 会生成不会剪，会剪没有画布。<br>' +
    '真实产品里：画布上的每个节点就是一个镜头卡片，剪完直接落到时间线，不用导出再导入。</div>' +

    '<div class="card"><div class="t">时间线（点「+」加镜头，点镜头选中）</div>' +
      '<div class="tl">' + h + '</div>' +
      '<div class="btns" style="margin-top:13px">' +
        '<button class="btn primary" onclick="joinClips()" ' + (S.clips.length < 2 ? 'disabled' : '') + '>连成一段</button>' +
        (S.sel >= 0 ? '<button class="btn" onclick="trimClip()">把这个镜头剪短一点</button>' : '') +
        (joined ? '<button class="btn" onclick="nextFromL2()">下一关</button>' : '') +
      '</div>' +
      (joined ? '<div class="meta"><span>成片 <b>14.2 秒</b></span><span>转场 <b>叠化</b></span><span>720p</span><span>带水印 <b>是</b></span></div>' : '') +
    '</div>' +

    '<div class="card"><div class="t">这一关要回答的问题</div>' +
      '<div class="note" style="margin-top:0">' +
        '① 你会不会本能地想「把 A 拖到 B 前面」？<b>会的话，拖动就必须做，加减号按钮不够。</b><br>' +
        '② 镜头之间要不要转场，你第一反应是找哪个按钮？<br>' +
        '③ 剪短一帧的时候，你需要看见波形/帧预览吗？还是看数字就够？<br>' +
        '这一关的反馈直接决定「画布」和「时间线」到底该不该是两块界面。' +
      '</div></div>';
}

function addClip() {
  if (S.clips.length >= 5) { log('l2.add_blocked', 'warn', '试玩版最多 5 个镜头'); render(); return; }
  var names = ['镜头 1', '镜头 2', '镜头 3', '镜头 4', '镜头 5'];
  S.clips.push({ n: names[S.clips.length] });
  log('l2.add_clip', '', '共 ' + S.clips.length + ' 个');
  render();
}

function pickClip(i) { S.sel = i; log('l2.select', '', '第 ' + (i + 1) + ' 个'); render(); }

function trimClip() {
  log('l2.trim', '', '第 ' + (S.sel + 1) + ' 个 · 减 0.5s');
  render();
}

function joinClips() {
  if (S.clips.length < 2) return;
  log('l2.join', 'ok', S.clips.length + ' 个镜头 · 叠化转场');
  S.done.l2 = 1;
  log('l2.first_timeline_s', 'ok', elapsed() + 's 拼出第一段');
  render();
}

function nextFromL2() { S.step = 3; log('flow.enter', '', 'L3 机位'); render(); }

/* ── 第 3 关：定一个机位 ─────────────────────────── */
var CAMS = {
  '正面中景': 'rotateY(0deg) translateZ(0)',
  '侧面 45°': 'rotateY(-45deg) translateZ(4px)',
  '俯视': 'rotateX(18deg) rotateY(-8deg) translateY(-6px)',
  '仰视': 'rotateX(-14deg) rotateY(6deg) translateY(6px)'
};

function viewL3() {
  var tf = S.cam ? CAMS[S.cam] : 'rotateY(0deg)';
  var btns = '';
  for (var k in CAMS) {
    btns += '<button class="' + (S.cam === k ? 'on' : '') + '" onclick="setCam(\'' + k + '\')">' + k + '</button>';
  }

  return '<div class="h1">第 3 关 · 定一个机位</div>' +
    '<div class="sub">这关验证的是<b>别人没有的那一段</b>：生成工具只会出图，剪辑工具没有三维空间。<br>' +
    '真实产品里：这是一个真的 3D 导演台，人偶可以摆姿势、可以换机位、可以打光，再出图。</div>' +

    '<div class="card"><div class="t">导演台（点下面换机位）</div>' +
      '<div class="stage3d"><div class="floor"></div>' +
        '<div class="figure" style="transform:' + tf + '">' +
          '<div class="head"></div><div class="torso"></div><div class="legs"></div>' +
        '</div>' +
      '</div>' +
      '<div class="cams">' + btns + '</div>' +
      (S.done.l3 ? '<div class="meta"><span>机位 <b>' + S.cam + '</b></span><span>镜头 <b>50mm</b></span><span>输出 <b>定妆图 1024×1024</b></span></div>' : '') +
    '</div>' +

    '<div class="card"><div class="t">这一关要回答的问题</div>' +
      '<div class="note" style="margin-top:0">' +
        '① 你会不会觉得「为了一个角度，要进 3D，太麻烦」？<b>会的话，说明这一段应该藏在按钮后面，不做成主界面。</b><br>' +
        '② 换机位之后你期待画面立刻变，还是等一会儿也能接受？<br>' +
        '③ 你需要看到人偶的「姿势库」吗，还是只想要「这个角度」这个结果？<br>' +
        '这关是最容易被砍掉的一段 —— 也是最能区分「你是画布工具还是 AI 生成器」的一段。' +
      '</div></div>' +

    '<div class="btns">' +
      '<button class="btn primary" onclick="finishL3()" ' + (S.cam ? '' : 'disabled') + '>' +
        (S.cam ? '用这个机位出图，结束试玩' : '先选一个机位') + '</button>' +
      '<button class="btn ghost" onclick="skipToEnd()">跳过，直接看结论</button>' +
    '</div>';
}

function setCam(k) {
  S.cam = k;
  S.done.l3 = 1;
  log('l3.cam', '', k);
  render();
}

function finishL3() {
  log('l3.render', 'ok', S.cam + ' · 1024×1024');
  log('flow.finish', 'ok', '全程 ' + elapsed() + 's');
  S.step = 4;
  render();
}

/* ── 结束页 ─────────────────────────────────────── */
function viewEnd() {
  var qs = [
    { id: 'q1', q: '这台机器上下载完，你今天能做出一条能发出去的片吗？', o: ['能，很顺', '能，但很折腾', '不能，卡住了'] },
    { id: 'q2', q: '哪一关你最想砍掉？', o: ['启动体检', '图生视频', '时间线', '3D 机位'] },
    { id: 'q3', q: '如果只留一个功能给你，你留哪个？', o: ['画布摆想法', '3D 定机位', '时间线精剪', '团队一起改'] }
  ];
  var qh = '';
  for (var i = 0; i < qs.length; i++) {
    var q = qs[i], oh = '';
    for (var j = 0; j < q.o.length; j++) {
      var on = S.answers[q.id] === q.o[j];
      oh += '<button class="opt' + (on ? ' on' : '') + '" onclick="ans(\'' + q.id + '\',\'' + q.o[j] + '\')">' + q.o[j] + '</button>';
    }
    qh += '<div class="question"><div class="q">' + (i + 1) + '. ' + q.q + '</div><div class="opts">' + oh + '</div></div>';
  }
  var nAns = Object.keys(S.answers).length;
  var submitted = S.done.survey;

  var summary =
    '<table><tbody>' +
    '<tr><td>启动自检</td><td class="a">' + (S.done.check ? '通过 · 显存 ' + S.vram + ' GB' : '被跳过') + '</td></tr>' +
    '<tr><td>第一条片</td><td class="a">' + (S.done.l1 ? '拿到了 · 全程第 ' + elapsed() + ' 秒' : '没走到') + '</td></tr>' +
    '<tr><td>拼出第一段</td><td class="a">' + (S.done.l2 ? '拼成了 · ' + S.clips.length + ' 个镜头' : '没走到') + '</td></tr>' +
    '<tr><td>3D 机位</td><td class="a">' + (S.done.l3 ? '用了 · ' + S.cam : '没走到') + '</td></tr>' +
    '<tr><td>退出在哪一步</td><td class="a">' + (S.step >= 4 ? '走完了全程' : STEPS[S.step]) + '</td></tr>' +
    '<tr><td>埋点条数</td><td class="a">' + S.logs.length + ' 条</td></tr>' +
    '</tbody></table>';

  return '<div class="end-head"><div class="big">🎬 本次试玩到此为止</div>' +
      '<p>你走完了 ' + (S.done.l1 ? (S.done.l2 ? (S.done.l3 ? '全部 4 个关卡' : '3 个关卡') : '2 个关卡') : '体检') +
      '，用时 ' + elapsed() + ' 秒。真实版本里，这一页会把数据整理成一份「你卡在哪」的报告。</p></div>' +

    '<div class="card"><div class="t">这次试玩采集到的（示意）</div>' + summary + '</div>' +

    '<div class="card"><div class="t">试玩版给什么 · 正式版给什么</div>' +
      '<table><thead><tr><th></th><th>试玩版（你现在用的）</th><th>正式版</th></tr></thead><tbody>' +
      '<tr><td>导出</td><td class="a">720p · 30 秒上限 · <span class="tagb">带「试玩版」角标</span></td><td class="b">4K · 不限时长 · 无水印</td></tr>' +
      '<tr><td>模型内核</td><td class="a">固定 3 个</td><td class="b">全部内核 + 持续新增（每季适配新模型）</td></tr>' +
      '<tr><td>画布</td><td class="a">最多 5 个节点</td><td class="b">无限</td></tr>' +
      '<tr><td>3D 导演台</td><td class="a">4 个预设机位</td><td class="b">完整：摆姿势 / 打光 / 换人偶</td></tr>' +
      '<tr><td>团队</td><td class="a">只有你一个人</td><td class="b">局域网协作 · 版本历史 · 批注 · 三档身份</td></tr>' +
      '<tr><td>更新</td><td class="a"><span class="tagb">停更 —— 拿不到新模型适配</span></td><td class="b">持续</td></tr>' +
      '<tr><td>你做的片子</td><td class="a" colspan="2" style="color:var(--ok)">永远归你，换正式版也不影响已导出的文件</td></tr>' +
      '</tbody></table>' +
      '<div class="note"><b>为什么这么设计：</b>本地软件装在你电脑上，我们没法远程收回 —— 所以不靠锁，靠<b>分流</b>。' +
      '试玩版永远能用，但它会停在今天这个版本；正式版的价值不是「解锁」，是「一直跟得上新模型」。' +
      '你做的成片永远不会被扣作人质。</div>' +
    '</div>' +

    '<div class="card"><div class="t">三个问题（答完这份试玩才算完整）</div>' + qh + '</div>' +

    '<div class="btns">' +
      '<button class="btn primary" onclick="submitSurvey()" ' + (nAns < 3 || submitted ? 'disabled' : '') + '>' +
        (submitted ? '已提交，谢谢' : '提交反馈（还差 ' + (3 - nAns) + ' 题）') + '</button>' +
      '<button class="btn ghost" onclick="reset()">再走一遍</button>' +
    '</div>' +

    (submitted ? '<div class="note" style="color:var(--ok)">收到了。这份原型不上传任何东西，数据都在你这台机器上 —— 和正式产品的原则一致。</div>' : '');
}

function ans(qid, val) {
  S.answers[qid] = val;
  log('survey.' + qid, '', val);
  render();
}

function submitSurvey() {
  S.done.survey = 1;
  log('survey.submit', 'ok', Object.keys(S.answers).length + ' 题');
  document.getElementById('foot').innerHTML =
    '试玩结束。真实版本里，这份数据会和诊断包一起打包发给我们 —— 不会自动上传。';
  render();
}

function toggleTheme() {
  var d = document.documentElement;
  d.setAttribute('data-theme', d.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function reset() {
  SESS += 1;
  T0 = performance.now();
  S.step = 0; S.busy = false; S.prog = 0; S.cur = '';
  S.logs = []; S.clips = []; S.sel = -1; S.cam = '';
  S.answers = {}; S.done = {};
  document.getElementById('foot').innerHTML =
    '真实版本里这里记的是：启动成功率、显存不足占比、从打开到第一条片的秒数、退出在哪一步。';
  log('session.start', '', '试玩开始');
  render();
}

log('session.start', '', '试玩开始');
render();
</script>
</body>
</html>
