<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>拾光剪影 · 小白模式原型（21 种卡片全量版）</title>
<style>
  :root{
    --bg:#f7f8fa;--surface:#fff;--surface-2:#fbfcfd;
    --line:#e6e9ee;--line-2:#d3d9e0;
    --ink:#141c2e;--ink-2:#4d586b;--ink-3:#8b96a7;
    --brand:#2563eb;--brand-2:#1d4ed8;--brand-soft:#eff4ff;--accent:#f97316;
    --r:14px;--r-sm:9px;
    --sh-1:0 1px 2px rgba(20,28,46,.05);
    --sh-2:0 2px 8px rgba(20,28,46,.07);
    --sh-3:0 12px 32px rgba(20,28,46,.16);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--ink);font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;
    height:100vh;display:flex;flex-direction:column;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ── 顶栏 ── */
  header{height:54px;flex:none;background:var(--surface);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:0 16px;z-index:60}
  .logo{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14.5px;letter-spacing:-.01em}
  .logo-dot{width:9px;height:9px;border-radius:3px;background:linear-gradient(135deg,var(--brand),#7c3aed)}
  .tier{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:2.5px;gap:2px}
  .tier button{padding:5px 13px;border-radius:7px;font-size:12px;color:var(--ink-2);font-weight:500}
  .tier button.on{background:var(--surface);color:var(--brand);box-shadow:var(--sh-1)}
  .sp{flex:1}
  .diff{display:flex;align-items:center;background:var(--surface-2);border:1px solid var(--line);
    border-radius:10px;padding:3px 3px 3px 11px;gap:8px}
  .diff span{font-size:11px;color:var(--ink-3)}
  .diff button{padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;background:var(--ink);color:#fff;
    transition:.16s}
  .diff button:hover{background:var(--brand);transform:translateY(-1px)}
  .diff button.alt{background:var(--surface);color:var(--ink-2);border:1px solid var(--line-2);font-weight:500}
  .ver{font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ── 布局 ── */
  .body{flex:1;display:grid;grid-template-columns:262px 1fr 320px;min-height:0}
  aside{background:var(--surface);overflow-y:auto;padding:14px 12px 40px}
  aside.left{border-right:1px solid var(--line)}
  aside.right{border-left:1px solid var(--line)}
  main{position:relative;overflow:hidden}

  /* ── 左栏 ── */
  .grp{margin-bottom:14px}
  .grp-h{display:flex;align-items:center;gap:7px;padding:0 6px 7px;font-size:11px;font-weight:600;
    color:var(--ink-3);letter-spacing:.05em}
  .grp-h .gico{font-size:12.5px}
  .grp-h .gc{margin-left:auto;font-weight:500;font-size:10px;color:var(--ink-3);background:var(--bg);
    border-radius:20px;padding:1px 7px;min-width:20px;text-align:center}
  .node{display:flex;align-items:center;gap:9px;width:100%;padding:7px 8px;border-radius:var(--r-sm);
    text-align:left;border:1px solid transparent;transition:.13s}
  .node:hover{background:var(--brand-soft);border-color:#d3e0ff;transform:translateX(2px)}
  .node:active{transform:translateX(2px) scale(.985)}
  .n-ico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:none;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.04)}
  .n-tx{flex:1;min-width:0}
  .n-tx b{display:block;font-size:12.5px;font-weight:500;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .n-tx em{display:block;font-style:normal;font-size:10.5px;color:var(--ink-3);line-height:1.4;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .tpl-w{margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
  .tpl-g{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .tpl{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;text-align:left;
    background:var(--surface);transition:.14s}
  .tpl:hover{border-color:var(--brand);box-shadow:var(--sh-2);transform:translateY(-2px)}
  .tpl-cv{height:46px;display:grid;place-items:center;font-size:19px;
    background:linear-gradient(160deg,var(--brand-soft),#f5f0ff)}
  .tpl-t{padding:6px 8px}
  .tpl-t b{display:block;font-size:11px;font-weight:600;line-height:1.35}
  .tpl-t em{font-style:normal;font-size:10px;color:var(--ink-3)}

  /* ── 画布 ── */
  #canvas{position:absolute;inset:0;overflow:auto;
    background-color:var(--bg);
    background-image:radial-gradient(circle,#dde2e9 .8px,transparent .8px);background-size:18px 18px}
  #world{position:relative;width:2600px;height:1700px}
  #edges{position:absolute;inset:0;pointer-events:none;overflow:visible}

  .hud{position:absolute;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
    background:rgba(20,28,46,.94);color:#fff;border-radius:22px;padding:8px 16px;display:flex;gap:16px;
    align-items:center;font-size:11.5px;backdrop-filter:blur(10px);box-shadow:var(--sh-3)}
  .hud kbd{background:rgba(255,255,255,.17);padding:1.5px 6px;border-radius:5px;font-family:inherit;
    font-size:10.5px;margin-right:3px}
  .hud i{font-style:normal;color:#9fb0c9}
  .canvas-tag{position:absolute;left:18px;top:16px;z-index:20;font-size:11px;color:var(--ink-3);
    background:rgba(255,255,255,.82);backdrop-filter:blur(6px);padding:5px 11px;border-radius:8px;
    border:1px solid var(--line)}

  /* ── 卡片（240×200 冻结不变量） ── */
  .card{position:absolute;width:240px;height:200px;background:var(--surface);border:1px solid var(--line-2);
    border-radius:16px;display:flex;flex-direction:column;user-select:none;overflow:visible;
    box-shadow:var(--sh-1);transition:box-shadow .14s,border-color .14s}
  .card:hover{box-shadow:var(--sh-2)}
  .card.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.14),var(--sh-2)}
  .card.drag{cursor:grabbing;box-shadow:var(--sh-3);z-index:40}
  .card.bond-r{border-top-right-radius:0;border-bottom-right-radius:0;border-right-color:transparent}
  .card.bond-l{border-top-left-radius:0;border-bottom-left-radius:0;border-left-color:transparent}
  .card.bond-b{border-bottom-left-radius:0;border-bottom-right-radius:0;border-bottom-color:transparent}
  .card.bond-t{border-top-left-radius:0;border-top-right-radius:0;border-top-color:transparent}
  .accent{position:absolute;left:0;top:0;bottom:0;width:3.5px;border-radius:16px 0 0 16px}

  .c-h{height:40px;flex:none;display:flex;align-items:center;gap:8px;padding:0 11px 0 13px}
  .c-i{font-size:15px;line-height:1}
  .c-t{flex:1;font-size:12.5px;font-weight:600;letter-spacing:-.01em;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap}
  .c-b{flex:1;min-height:0;padding:0 11px 0 13px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
  .c-tip{font-size:10px;line-height:1.5;color:#8a5a12;background:linear-gradient(180deg,#fef6e7,#fdf1dd);
    border:1px solid #f8e6c8;border-radius:7px;padding:4px 7px;flex:none}
  .c-th{flex:1 1 auto;min-height:0;border-radius:9px;background:linear-gradient(150deg,#eef1f6,#e4e9f0);
    display:grid;place-items:center;font-size:28px;overflow:hidden;position:relative}
  .c-th .ph{font-size:10.5px;color:var(--ink-3)}
  .c-tx{font-size:11.5px;color:var(--ink-2);line-height:1.55;flex:none;display:-webkit-box;
    -webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-ed{flex:1;min-height:46px;font:inherit;font-size:11.5px;line-height:1.55;border:1.5px solid var(--brand);
    border-radius:8px;padding:6px 8px;resize:none;outline:none;color:var(--ink)}
  .c-mt{font-size:10px;color:var(--ink-3);flex:none;display:flex;gap:4px;flex-wrap:wrap}
  .c-mt i{font-style:normal;background:var(--bg);border-radius:5px;padding:1.5px 6px;white-space:nowrap}
  .c-f{height:32px;flex:none;display:flex;align-items:center;gap:8px;padding:0 9px 0 13px;
    border-top:1px solid var(--line)}
  .lamp{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 0 2.5px rgba(0,0,0,.035)}
  .cap{display:flex;gap:3px}
  .cap i{width:5.5px;height:5.5px;border-radius:50%;background:var(--line-2);display:block}
  .cap i.on{background:var(--ok,#16a34a)}
  .lay{font-size:10px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .fs{flex:1}
  .c-mb{width:21px;height:21px;border-radius:6px;color:var(--ink-3);font-size:15px;line-height:1}
  .c-mb:hover{background:var(--bg);color:var(--ink)}
  .c-mu{position:absolute;right:7px;bottom:34px;background:var(--surface);border:1px solid var(--line-2);
    border-radius:10px;box-shadow:var(--sh-3);padding:4px;min-width:108px;z-index:50}
  .c-mu button{display:block;width:100%;text-align:left;padding:6px 10px;border-radius:7px;font-size:12px}
  .c-mu button:hover{background:var(--brand-soft);color:var(--brand)}
  .seam{position:absolute;background:var(--brand);border-radius:3px;pointer-events:none;z-index:6;
    box-shadow:0 0 0 3px rgba(37,99,235,.15);animation:pop .18s cubic-bezier(.3,1.4,.5,1)}
  @keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}

  /* ── 右栏 ── */
  .sec{border-bottom:1px solid var(--line);padding:15px 16px}
  .ph{display:flex;align-items:center;gap:10px;margin-bottom:13px}
  .ph-i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:16px}
  .ph b{font-size:14px;font-weight:600;display:block;line-height:1.3;letter-spacing:-.01em}
  .ph em{font-style:normal;font-size:11px;color:var(--ink-3);line-height:1.4}
  .cl{border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;margin-bottom:7px}
  .cl-h{display:flex;align-items:center;gap:7px;padding:7px 11px;background:var(--surface-2);font-size:11.5px}
  .cl-h b{font-weight:600}
  .cl-h .d{width:6px;height:6px;border-radius:50%;margin-left:auto}
  .cl-b{padding:8px 11px;font-size:11.5px;color:var(--ink-2);border-top:1px solid var(--line);line-height:1.6}
  .fld{margin-bottom:12px}
  .fld:last-child{margin-bottom:0}
  .fld label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-2);margin-bottom:6px}
  .fld label b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
  .seg{display:flex;gap:4px;flex-wrap:wrap}
  .seg button{flex:1;min-width:50px;padding:6px 5px;border:1px solid var(--line-2);border-radius:7px;
    font-size:11px;color:var(--ink-2);background:var(--surface);transition:.12s}
  .seg button:hover:not(.on){background:var(--bg)}
  .seg button.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);font-weight:600}
  input[type=range]{width:100%;accent-color:var(--brand)}
  .fold{width:100%;display:flex;align-items:center;gap:7px;padding:8px 0;font-size:12px;color:var(--ink-2);
    border-top:1px solid var(--line);font-weight:500}
  .fold .ar{transition:transform .16s;font-size:9px;color:var(--ink-3)}
  .fold.on .ar{transform:rotate(90deg)}
  .fold:hover{color:var(--brand)}
  .act{width:100%;padding:10px;border-radius:10px;background:var(--brand);color:#fff;font-size:12.5px;
    font-weight:600;margin-top:12px;transition:.14s;box-shadow:0 1px 3px rgba(37,99,235,.3)}
  .act:hover{background:var(--brand-2);transform:translateY(-1px);box-shadow:0 3px 8px rgba(37,99,235,.35)}
  .na{display:flex;gap:10px;padding:11px 12px;border-radius:var(--r-sm);font-size:11.5px;line-height:1.6;
    margin-bottom:11px}
  .na.warn{background:#fff7ed;border:1px solid #fbd5a5;color:#9a3412}
  .na.info{background:var(--brand-soft);border:1px solid #d6e2ff;color:#1e3a8a}
  .na-i{flex:none;font-size:15px;line-height:1.35}
  .na b{display:block;font-weight:600;margin-bottom:3px}
  .na-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .na-btns button{padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.8);font-size:11px;font-weight:500;
    border:1px solid rgba(0,0,0,.05)}
  .na-btns button:hover{background:#fff}
  .tip{font-size:11px;color:var(--ink-3);line-height:1.65}
  .quick{width:100%;display:flex;gap:11px;align-items:flex-start;padding:13px;border-radius:var(--r);
    border:1px solid var(--line);background:var(--surface-2);text-align:left;margin-bottom:9px;transition:.14s}
  .quick:hover{border-color:var(--brand);background:var(--brand-soft);transform:translateX(2px)}
  .quick .qi{font-size:20px;line-height:1.2;flex:none}
  .quick b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
  .quick em{font-style:normal;font-size:11px;color:var(--ink-2);line-height:1.55}
  .ta{width:100%;min-height:96px;border:1.5px solid var(--brand);border-radius:var(--r-sm);padding:10px;
    font:inherit;font-size:12px;resize:vertical;outline:none;line-height:1.65}
  .row{display:flex;gap:8px;margin-top:9px;justify-content:flex-end}
  .btn{padding:7px 14px;border-radius:8px;font-size:12px;font-weight:500}
  .btn.pri{background:var(--brand);color:#fff}
  .btn.pri:hover{background:var(--brand-2)}
  .btn.sec{color:var(--ink-2)}
  .btn.sec:hover{background:var(--bg)}
  .sec-t{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;margin:0 0 10px}

  /* ── 方案对照 ── */
  .plan{flex:none;background:var(--surface);border-top:1px solid var(--line);max-height:40vh;display:flex;
    flex-direction:column}
  .plan-t{flex:none;display:flex;align-items:center;gap:10px;padding:11px 16px;background:var(--surface-2);
    border-bottom:1px solid transparent}
  .plan-t.on{border-bottom-color:var(--line)}
  .plan-t b{font-size:12.5px;font-weight:600}
  .bdg{font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--brand-soft);color:var(--brand);
    font-weight:600}
  .plan-t .ar{margin-left:auto;transition:transform .2s;color:var(--ink-3);font-size:11px}
  .plan-t.on .ar{transform:rotate(180deg)}
  .plan-b{display:none;overflow:auto;padding:14px 16px 18px}
  .plan-b.on{display:block}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-weight:600;color:var(--ink-3);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;
    background:var(--surface-2);position:sticky;top:0}
  td.b4{color:var(--ink-3)}
  td.af{color:var(--ink);font-weight:500}
  .tag{display:inline-block;font-size:10px;padding:1.5px 7px;border-radius:5px;font-weight:600}
  .t-p0{background:#fee2e2;color:#b91c1c}
  .t-p1{background:#ffedd5;color:#c2410c}
  .t-p2{background:#e0e7ff;color:#4338ca}
  .lg{display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--ink-2);padding-top:11px;margin-top:3px;
    border-top:1px solid var(--line)}
  .lg span{display:flex;align-items:center;gap:6px}
  .lg i{width:18px;height:2.5px;border-radius:2px;display:block}
  .splash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:1}
  .splash div{text-align:center;color:var(--ink-3)}
  .splash b{display:block;font-size:16px;color:var(--ink-2);font-weight:600;margin-bottom:5px;letter-spacing:-.01em}
  .hid{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo"><span class="logo-dot"></span>拾光剪影</div>
  <div class="tier">
    <button class="on" id="tNov">小白模式</button>
    <button id="tPro">专业模式</button>
  </div>
  <div class="sp"></div>
  <div class="diff"><span>对比：</span><button id="diffBtn" class="alt">改进前 · 现状</button></div>
  <div class="ver">原型 v3 · 21 种卡片全量</div>
</header>

<div class="body">
  <aside class="left" id="left"></aside>
  <main>
    <div id="canvas">
      <svg id="edges"></svg>
      <div id="world"><div class="splash" id="splash"><div><b>空画布</b>左边 21 种卡片随时可用，或在右侧写一句话</div></div></div>
    </div>
    <div class="canvas-tag" id="canvasTag">磁吸意图画布 · 小白模式</div>
    <div class="hud">
      <span><i>拖动卡片靠近 → 自动吸附</i></span>
      <span><kbd>单击</kbd>直接写</span>
      <span><kbd>双击</kbd>精调</span>
      <span><i>咬合</i> <b id="bondN">0</b></span>
      <span><i>卡片</i> <b id="cardN">0</b></span>
    </div>
  </main>
  <aside class="right" id="right"></aside>
</div>

<div class="plan">
  <button class="plan-t" id="planT">
    <b>方案对照</b><span class="bdg">9 项 · 按优先级</span>
    <span style="font-size:11px;color:var(--ink-3)">每项含改进前 / 改进后 / 实现代价</span>
    <span class="ar">▾</span>
  </button>
  <div class="plan-b" id="planB"></div>
</div>

<script>
/* ═══ 21 种卡片全量数据 ═══ */
const K={
 directorCard:{i:'🎬',n:'写个故事',d:'一段剧情自动拆成分镜',c:'#a855f7',g:'开始创作',
   f:'script',ph:'输入一段剧情，自动拆解角色 / 场景 / 分镜…',
   h:'输入剧本 → 自动拆解角色 / 场景 / 分镜并排好序列',legacy:'导演卡'},
 shot:{i:'🎥',n:'出一张画面',d:'分镜画面 · 有景别焦段',c:'#4ade80',g:'开始创作',
   f:'prompt',ph:'用大白话描述这一镜的画面…',
   h:'镜头节点：填写 Prompt → 点「生成选中」开始生图 / 生视频',legacy:'镜头'},
 script:{i:'📖',n:'写剧本',d:'剧本大纲，会自动拆分镜',c:'#fbbf24',g:'开始创作',
   f:'content',ph:'写剧本大纲…',h:'剧本节点：写剧本大纲 → 自动拆成分镜镜头节点',legacy:'剧本'},
 shotlist:{i:'☰',n:'分镜表',d:'可编辑的镜号表',c:'#818cf8',g:'开始创作',
   f:'content',ph:'镜号 / 景别 / 时长…',h:'分镜表：可编辑的镜号表，逐镜排布',legacy:'分镜表'},
 storyboard:{i:'▦',n:'宫格分镜',d:'九宫格排版 + 交互裁格',c:'#818cf8',g:'开始创作',
   f:'content',ph:'宫格内容…',h:'宫格分镜：交互裁格，一屏看完一场戏',legacy:'宫格分镜'},
 image:{i:'🖼',n:'做张插图',d:'独立画面资产',c:'#38bdf8',g:'做画面',
   f:'prompt',ph:'描述想要的画面…',h:'图片节点：作为独立画面资产使用',legacy:'图片'},
 video:{i:'▶',n:'让它动起来',d:'视频 · 有运镜和时长',c:'#f472b6',g:'做画面',
   f:'prompt',ph:'描述想要的视频画面…',h:'镜头节点：填写 Prompt → 点「生成选中」开始生视频',legacy:'视频'},

function add(kind,x,y,o={}){
  if(!K[kind])return null;
  const c={id:'n'+(++uid),kind,x,y,status:'idle',text:o.text||'',meta:o.meta||[],
    title:IMP.v?(o.title||K[kind].n):K[kind].legacy,layers:0,depth:2};
  cards.push(c);render();return c;
}
const R=c=>({x:c.x,y:c.y,w:W,h:H});
function bonds(){
  const o=[],TOL=2,MIN=40;
  for(let i=0;i<cards.length;i++)for(let j=i+1;j<cards.length;j++){
    const a=R(cards[i]),b=R(cards[j]);
    const aR=a.x+a.w,aB=a.y+a.h,bR=b.x+b.w,bB=b.y+b.h;
    const oyS=Math.max(a.y,b.y),oyE=Math.min(aB,bB),oxS=Math.max(a.x,b.x),oxE=Math.min(aR,bR);
    const ovY=oyE-oyS,ovX=oxE-oxS;
    if(Math.abs(b.x-aR)<=TOL&&ovY>=MIN)o.push({a:cards[i],b:cards[j],s:'bond-r',p:[[aR,oyS],[aR,oyE]]});
    else if(Math.abs(a.x-bR)<=TOL&&ovY>=MIN)o.push({a:cards[i],b:cards[j],s:'bond-l',p:[[a.x,oyS],[a.x,oyE]]});
    else if(Math.abs(b.y-aB)<=TOL&&ovX>=MIN)o.push({a:cards[i],b:cards[j],s:'bond-b',p:[[oxS,aB],[oxE,aB]]});
    else if(Math.abs(a.y-bB)<=TOL&&ovX>=MIN)o.push({a:cards[i],b:cards[j],s:'bond-t',p:[[oxS,a.y],[oxE,a.y]]});
  }
  return o;
}
function ik(k){
  if(['directorCard','shotlist','storyboard'].includes(k))return'structure';
  if(['script','prompt','text','markdown','note'].includes(k))return'text';
  if(['audio','music','digitalHuman'].includes(k))return'audio';
  return'frame';
}
function ok(a,b){
  if(['audio','music'].includes(a)&&['image','shot','panorama'].includes(b))return false;
  if(['image','shot','panorama'].includes(a)&&['image','shot'].includes(b))return false;
  return true;
}
function edgeOf(bd){
  const f=bd.a.kind,t=bd.b.kind;
  if(!IMP.v)return{...LEG,nameOf:null};
  if(!ok(f,t))return{...IE.conflict,nameOf:t};
  return{...IE[ik(f)],nameOf:t};
}

function render(){
  $$('.card',world).forEach(e=>e.remove());
  $$('.seam',world).forEach(e=>e.remove());
  svg.innerHTML='';
  $('#splash').classList.toggle('hid',cards.length>0);
  $('#bondN').textContent=bonds().length;
  $('#cardN').textContent=cards.length;
  const bs=bonds();
  bs.forEach(bd=>{
    const info=edgeOf(bd),[[x1,y1],[x2,y2]]=bd.p;
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',x1);ln.setAttribute('y1',y1);ln.setAttribute('x2',x2);ln.setAttribute('y2',y2);
    ln.setAttribute('stroke',info.c);ln.setAttribute('stroke-width',info.c==='#94a3b8'?1.4:2);
    if(info.c==='#94a3b8')ln.setAttribute('stroke-dasharray','4 3');
    svg.appendChild(ln);
    if(IMP.v&&info.c!=='#94a3b8'){
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      const vert=(x1===x2),mx=(x1+x2)/2,my=(y1+y2)/2;
      t.setAttribute('x',vert?mx+7:mx);t.setAttribute('y',vert?my:my-7);
      t.setAttribute('font-size','10.5');t.setAttribute('fill',info.c);
      t.setAttribute('font-weight','600');t.setAttribute('text-anchor',vert?'start':'middle');
      t.textContent=info.t+(info.nameOf?' → '+nm(info.nameOf):'');
      svg.appendChild(t);
    }
  });
  cards.forEach(c=>{
    const k=K[c.kind];if(!k)return;
    const n=el('article','card'+(sel===c.id?' on':''));
    n.style.left=c.x+'px';n.style.top=c.y+'px';
    const ac=el('div','accent');ac.style.background=k.c;n.appendChild(ac);
    bs.filter(x=>x.a.id===c.id).forEach(x=>n.classList.add(x.s));
    bs.filter(x=>x.b.id===c.id).forEach(x=>{
      if(x.s==='bond-r')n.classList.add('bond-l');
      if(x.s==='bond-l')n.classList.add('bond-r');
      if(x.s==='bond-b')n.classList.add('bond-t');
      if(x.s==='bond-t')n.classList.add('bond-b');
    });
    const hd=el('header','c-h');
    hd.appendChild(el('span','c-i',k.i));
    const ti=el('span','c-t',c.title||k.legacy);ti.title=c.title||k.legacy;
    hd.appendChild(ti);n.appendChild(hd);
    const bd=el('div','c-b');
    bd.appendChild(el('div','c-tip',k.h));
    if(['shot','image','video','director','digitalHuman','panorama','animation'].includes(c.kind)){
      const th=el('div','c-th');
      th.innerHTML=c.status==='done'?`<span>${k.i}</span>`:'<span class="ph">等待生成</span>';
      bd.appendChild(th);
    }
    if(sel===c.id){
      const ta=el('textarea','c-ed');ta.value=c.text;ta.placeholder=k.ph||'这个卡片没有可输入文本';
      ta.oninput=e=>c.text=e.target.value;
      ta.onclick=e=>e.stopPropagation();
      bd.appendChild(ta);
    }else if(c.text)bd.appendChild(el('p','c-tx',c.text));
    if(c.meta.length){const m=el('div','c-mt');c.meta.forEach(x=>m.appendChild(el('i',null,x)));bd.appendChild(m);}
    n.appendChild(bd);
    const ft=el('footer','c-f');
    const lp=el('span','lamp');lp.style.background=LAMP[c.status];ft.appendChild(lp);
    const cp=el('div','cap');for(let i=0;i<3;i++)cp.appendChild(el('i',i<c.depth?'on':''));
    ft.appendChild(cp);
    if(c.layers)ft.appendChild(el('span','lay','×'+c.layers));
    ft.appendChild(el('span','fs'));
    const mb=el('button','c-mb','⋯');mb.onclick=e=>{e.stopPropagation();menu(c)};ft.appendChild(mb);
    n.appendChild(ft);
    n.onmousedown=e=>startDrag(e,c);
    n.ondblclick=e=>{e.stopPropagation();sel=c.id;adv=true;render()};
    n.onclick=e=>{e.stopPropagation();if(sel!==c.id){sel=c.id;render()}};
    world.appendChild(n);
  });
  panel();
}
function menu(c){
  $$('.c-mu',world).forEach(e=>e.remove());
  const m=el('div','c-mu');
  const mk=(t,fn)=>{const b=el('button',null,t);b.onclick=e=>{e.stopPropagation();fn();m.remove()};return b};
  if(c.kind==='director')m.appendChild(mk('打开舞台',()=>{}));
  m.appendChild(mk('生成新版本',()=>{c.layers++;render()}));
  m.appendChild(mk('复制卡片',()=>{cards.push({...c,id:'n'+(++uid),x:c.x+30,y:c.y+30,title:c.title+' 副本'});render()}));
  m.appendChild(mk('删除卡片',()=>{cards=cards.filter(x=>x.id!==c.id);if(sel===c.id)sel=null;render()}));
  world.appendChild(m);
}
function startDrag(e,c){
  if(e.target.closest('.c-mu'))return;
  e.preventDefault();$$('.c-mu',world).forEach(x=>x.remove());
  const n=e.currentTarget;n.classList.add('drag');
  drag={c,n,ox:e.clientX-c.x,oy:e.clientY-c.y,moved:false};
  document.addEventListener('mousemove',onDrag);
  document.addEventListener('mouseup',endDrag);
}
function onDrag(e){
  if(!drag)return;const{c,n,ox,oy}=drag;
  const nx=Math.max(0,Math.min(2400,e.clientX-canvas.scrollLeft-ox));
  const ny=Math.max(0,Math.min(1600,e.clientY-canvas.scrollTop-oy));
  drag.moved=true;
  const s=snap(nx,ny,c);
  c.x=s.x;c.y=s.y;n.style.left=c.x+'px';n.style.top=c.y+'px';
  seam(s.s);
}
function snap(nx,ny,self){
  let best=null;
  cards.forEach(o=>{
    if(o===self)return;
    const cd=[
      {g:Math.abs(nx-(o.x+W)),x:o.x+W,y:ny,v:1,ax:o.x+W,ay:ny},
      {g:Math.abs(nx+W-o.x),x:o.x-W,y:ny,v:1,ax:o.x,ay:ny},
      {g:Math.abs(ny-(o.y+H)),x:nx,y:o.y+H,v:0,ax:nx,ay:o.y+H},
      {g:Math.abs(ny+H-o.y),x:nx,y:o.y-H,v:0,ax:nx,ay:o.y}];
    cd.forEach(d=>{
      const ov=d.v?Math.max(0,Math.min(ny+H,o.y+H)-Math.max(ny,o.y))
                  :Math.max(0,Math.min(nx+W,o.x+W)-Math.max(nx,o.x));
      if(d.g<=10&&ov>=40&&(!best||d.g<best.g))
        best={x:d.x,y:d.y,g:d.g,s:{x:d.v?d.ax-2:d.x,y:d.v?d.y:d.ay-2,w:d.v?4:W,h:d.v?H:4}};
    });
  });
  return best?{x:best.x,y:best.y,s:best.s}:{x:nx,y:ny,s:null};
}
function seam(s){
  $$('.seam',world).forEach(e=>e.remove());
  if(!s)return;const d=el('div','seam');
  d.style.cssText+=`;left:${s.x}px;top:${s.y}px;width:${s.w}px;height:${s.h}px`;
  world.appendChild(d);
}
function endDrag(){
  if(drag){drag.n.classList.remove('drag');if(drag.moved)sel=drag.c.id;drag=null;render()}
  document.removeEventListener('mousemove',onDrag);
  document.removeEventListener('mouseup',endDrag);
}

  if(c.kind==='animation'){s1.appendChild(seg('动作',['待机','行走','奔跑','跳跃','攻击'],1));s1.appendChild(rng('帧数','24',2,48))}

function lb(t,v){const l=el('label');l.innerHTML=`<span>${t}</span>`+(v!=null?`<b>${v}</b>`:'');return l}
function seg(t,os,on){
  const f=el('div','fld');f.appendChild(lb(t));
  const s=el('div','seg');
  os.forEach((o,i)=>{const b=el('button',i===on?'on':'',o);
    b.onclick=()=>{$$('.seg button',s).forEach(x=>x.classList.remove('on'));b.classList.add('on')};s.appendChild(b)});
  f.appendChild(s);return f;
}
function rng(t,v,mn,mx){
  const f=el('div','fld'),l=lb(t,v);f.appendChild(l);
  const r=el('input');r.type='range';r.min=mn;r.max=mx;r.value=v;
  r.oninput=e=>l.querySelector('b').textContent=e.target.value;
  f.appendChild(r);return f;
}
function fold(t,on,fn){
  const b=el('button','fold'+(on?' on':''));
  b.innerHTML=`<span class="ar">▸</span>${t}`;b.onclick=fn;return b;
}
function run(c){
  if(!c.text.trim()){
    if(IMP.v){
      const n=el('div','na warn');
      n.appendChild(el('span','na-i','✍️'));
      n.appendChild(el('div','<b>还差一件事</b>给这张卡片写一句描述，比如「雨夜街口，霓虹灯下站着一个人」。'));
      c.natip=n;
    }
    render();return;
  }
  c.status='running';render();
  setTimeout(()=>{c.status='done';render()},1300);
}
function empty(){
  const w=el('div'),e=el('div');e.style.padding='18px 4px';
  e.appendChild(el('div','sec-t','一句话，开始你的片子'));

  const q=el('button','quick');
  q.innerHTML='<span class="qi">🎬</span><span><b>从一句话开始</b><em>写一句剧情，自动拆成一整套分镜卡片</em></span>';
  q.onclick=()=>{io=!io;panel()};e.appendChild(q);
  if(io){
    const ta=el('textarea','ta');
    ta.placeholder='例如：女主深夜回到空荡的老屋，发现桌上的照片全都变成了一年前的样子';

    row.appendChild(el('button','btn sec','取消')).onclick=()=>{io=false;panel()};
    const b2=el('button','btn pri','生成分镜');b2.onclick=()=>{brk(ta.value);io=false};row.appendChild(b2);
    e.appendChild(row);
    e.appendChild(el('div','tip','写一句话描述开场剧情，系统拆成「导演卡 → 一串分镜卡片」，你逐个生成画面即可。'));
  }
  const q2=el('button','quick');
  q2.innerHTML='<span class="qi">🖼</span><span><b>直接生一张图</b><em>写一句画面描述，点生成</em></span>';

  w.appendChild(e);return w;
}
function brk(script){
  cards=[];
  const c=add('directorCard',820,200,{text:script,title:'我的故事'});
  c.status='done';c.meta=['3 场'];
  ['雨夜街口 · 霓虹逆光','推门进屋 · 手持微晃','桌上的照片 · 特写'].forEach((t,i)=>{

}

/* ── 左栏：21 种全量 ── */
function left(){
  const w=$('#left');w.innerHTML='';
  w.appendChild(el('div','grp-h','<span class="gico">🧩</span>添加卡片<span class="gc">21</span>'));
  GROUPS.forEach(g=>{
    const ks=Object.keys(K).filter(k=>K[k].g===g);
    if(!ks.length)return;
    const grp=el('div','grp');
    const h=el('div','grp-h',`<span class="gico">${{'开始创作':'✍','做画面':'🎬','做声音':'🔊','摆位与实拍':'🧍','批量与设定':'⚙','素材与笔记':'📎','整理':'🗂'}[g]}</span>${g}<span class="gc">${ks.length}</span>`);
    h.style.marginTop='10px';grp.appendChild(h);
    ks.forEach(k=>{
      const d=K[k],b=el('button','node');
      b.innerHTML=`<span class="n-ico" style="background:${d.c}1f">${d.i}</span>
        <span class="n-tx"><b>${IMP.v?d.n:d.legacy}</b><em>${IMP.v?d.d:d.h.slice(0,9)}…</em></span>`;
      b.title=IMP.v?`${d.n}（专业模式：${d.legacy}）`:`${d.legacy} · ${d.h}`;
      b.onclick=()=>{sel=null;add(k,880,220+Math.random()*260)};
      grp.appendChild(b);
    });
    w.appendChild(grp);
  });
  const tw=el('div','tpl-w');
  tw.appendChild(el('div','grp-h','<span class="gico">✨</span>快速开始 · 模板'));
  const tg=el('div','tpl-g');
  TPLS.forEach(t=>{
    const b=el('button','tpl');
    b.innerHTML=`<div class="tpl-cv">${t.i}</div><div class="tpl-t"><b>${t.n}</b><em>${t.d}</em></div>`;
    b.onclick=()=>{sel=null;brk('（示例模板）'+t.n)};
    tg.appendChild(b);
  });
  tw.appendChild(tg);w.appendChild(tw);
}
