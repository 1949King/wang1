[pytest]
# B5: 统一 pytest 入口 (2026-05-31)

testpaths =
    app/tests
    tests/test_pipeline_optimizations.py

python_files =
    test_*.py
    *_test.py
    verify_*.py

python_classes =
    Test*
    Verify*

python_functions =
    test_*
    verify_*

# Qt 集成测试需要 offscreen 平台
# 设置环境变量: QT_QPA_PLATFORM=offscreen

# 标记
markers =
    unit: 单元测试 (毫秒级, 无副作用)
    integration: 集成测试 (秒级, 涉及多模块)
    e2e: 端到端测试 (秒到分钟级, 启动 Qt 窗口)
    perf: 性能测试
    slow: 慢速测试 (默认跳过)

# 默认跳过 slow
addopts =
    -v
    --tb=short
    -m "not slow"
    --strict-markers
