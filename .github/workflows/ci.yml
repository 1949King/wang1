# GitHub Actions CI for AI 短剧编辑器
# 2026-09-27 整改：单测从「只跑 test_buses.py」改为全量 app/tests；
#   触发路径补 tests/** · vendor/** · _verify/** · scripts/**；
#   去掉对 app/temp 草稿脚本的依赖，改为跑真实守卫；新增前端 vitest job。
# 触发: push / pull_request 到 main/master/develop
# 运行: .github/workflows/ci.yml

name: AI 短剧编辑器 CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'vendor/shiguang-canvas/**'
      - 'vendor/AI-Canvas-tauri/**'
      - '_verify/**'
      - 'scripts/**'
      - 'pytest.ini'
      - 'conftest.py'
      - 'app/requirements*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  # ============== Job 1: 单元测试 (秒级, 无 GUI) ==============
  unit-tests:
    name: 单元测试 (全量 app/tests)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      # 必须在仓库根跑：app/ 下没有 conftest.py，根 conftest.py 负责
      # 把 app/ 加入 sys.path（`cd app` 会让全量测试因导入失败而假红）。
      - name: 运行全量单元测试
        run: |
          python -m pytest app/tests tests/test_pipeline_optimizations.py --tb=short -q
        shell: pwsh

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/logs/pytest_*.txt
          if-no-files-found: ignore

  # ============== Job 2: 守卫回归（纯 Python，无外部依赖） ==============
  guards:
    name: 守卫回归 (冻结区/棘轮/契约/分层/双库)
    runs-on: windows-latest
    timeout-minutes: 10
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: 冻结区守护（85 锁点哈希）
        run: python scripts/frozen_zone_guard.py
        shell: pwsh

      - name: 稳定性门禁（存量棘轮，只减不增）
        run: python scripts/stability_gate.py
        shell: pwsh

      - name: 粘合层契约（跨线字段等价性）
        run: python _verify/check_glue_contract.py
        shell: pwsh

      - name: 架构守护（分层纪律）
        run: python scripts/arch_guard.py --scan app
        shell: pwsh

      - name: 双库一致性（防复漂）
        run: python _verify/check_canvas_dual_repo.py
        shell: pwsh

  # ============== Job 3: 前端校验 (画布真源 vitest) ==============
  frontend-tests:
    name: 前端校验 (画布 vitest)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vendor/shiguang-canvas/package-lock.json

      - name: 安装依赖 (npm ci)
        run: npm ci
        working-directory: vendor/shiguang-canvas

      - name: vitest 单元测试
        run: npm test -- --reporter=dot
        working-directory: vendor/shiguang-canvas
        shell: pwsh

  # ============== Job 4: 集成测试 (秒级, Qt offscreen) ==============
  integration-tests:
    name: 集成测试 (Integration / Qt offscreen)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit-tests  # 依赖单元测试先过

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需 + 可选)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-optional.txt
          pip install pytest playwright
          playwright install chromium

      - name: 启动 Qt6 验证 (集成)
        run: |
          cd app
          python -c "import sys; sys.path.insert(0, '.'); from PyQt6.QtCore import QT_VERSION_STR; print('Qt6:', QT_VERSION_STR)"
        shell: pwsh

      - name: 启动主程序 10 秒验证导入
        run: |
          $p = Start-Process -FilePath "python" -ArgumentList "-u","app/main_qt6.py" -PassThru -NoNewWindow -RedirectStandardOutput "app/logs/ci_run.log" -RedirectStandardError "app/logs/ci_err.log"
          Start-Sleep -Seconds 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "app/logs/ci_err.log") {
            $errContent = Get-Content "app/logs/ci_err.log" -Raw
            if ($errContent -match "Traceback|Error.*ModuleNotFoundError") {
              Write-Host "❌ 启动报错:" -ForegroundColor Red
              Write-Host $errContent
              exit 1
            }
          }
          Write-Host "✅ Qt6 启动无致命错误"
        shell: pwsh

      - name: 上传启动日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-startup-log
          path: |
            app/logs/ci_run.log
            app/logs/ci_err.log
          if-no-files-found: ignore

  # ============== Job 5: 打包验证 (PyInstaller smoke test) ==============
  build-smoke:
    name: 打包验证 (PyInstaller Smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: unit-tests
    # 仅打包保留了宽容：PyInstaller 首次跑通前受环境差异影响大；
    # 单测 / 守卫 / 前端 / 集成 四个 job 均不设 continue-on-error（真拦截）。
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: 打包 (PyInstaller)
        run: |
          cd app
          pyinstaller ai_video_editor_local.spec --noconfirm --log-level WARN
        shell: pwsh

      - name: 验证可执行文件存在
        run: |
          if (-not (Test-Path "app/dist/AI短剧编辑器/AI短剧编辑器.exe")) {
            Write-Host "❌ 打包失败: 可执行文件未生成" -ForegroundColor Red
            exit 1
          }
          $size = (Get-Item "app/dist/AI短剧编辑器/AI短剧编辑器.exe").Length
          Write-Host "✅ 打包成功: $size bytes"
        shell: pwsh

      - name: 上传打包产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-drama-editor-windows
          path: app/dist/
          retention-days: 7
