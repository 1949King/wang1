# GitHub Actions CI for AI 短剧编辑器
# 2026-09-27 整改：单测从「只跑 test_buses.py」改为全量 app/tests；
#   触发路径补 tests/** · vendor/** · _verify/** · scripts/**；
#   去掉对 app/temp 草稿脚本的依赖，改为跑真实守卫；新增前端 vitest job。
# 触发: push / pull_request 到 main/master/develop
# 运行: .github/workflows/ci.yml

name: AI 短剧编辑器 CI

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'vendor/shiguang-canvas/**'
      - 'vendor/AI-Canvas-tauri/**'
      - '_verify/**'
      - 'scripts/**'
      - 'pytest.ini'
      - 'conftest.py'
      - 'app/requirements*.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:  # 允许手动触发

env:
  PYTHON_VERSION: "3.12"
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8

jobs:
  # ============== Job 1: 单元测试 (秒级, 无 GUI) ==============
  unit-tests:
    name: 单元测试 (全量 app/tests)
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest pytest-cov

      # 必须在仓库根跑：app/ 下没有 conftest.py，根 conftest.py 负责
      # 把 app/ 加入 sys.path（`cd app` 会让全量测试因导入失败而假红）。
      # 2026-10-09：加 --cov，产出覆盖率 json 供下一步的棘轮门禁消费。
      - name: 运行全量单元测试（含覆盖率采样）
        run: |
          python -m pytest -q --tb=short `
            --cov=app `
            --cov-report=term:skip-covered `
            --cov-report=json:coverage.json
        shell: pwsh

      # 覆盖率棘轮：只校验「已覆盖的行不许变回未覆盖」，不是「覆盖率必须达 X%」。
      # 语义与 ruff_gate / stability_gate 一致，见 _verify/check_coverage.py 文件头。
      - name: 覆盖率棘轮（只增不减）
        run: python _verify/check_coverage.py --json coverage.json
        shell: pwsh

      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            app/logs/pytest_*.txt
            coverage.json
          if-no-files-found: ignore

  # ============== Job 2: 守卫回归（= 本地 9 道门禁的全量模式） ==============
  # 2026-10-09 改造：此前本 job 把 冻结区/稳定性/契约/分层/双库 五道**各抄一遍**，
  # 而本地 hook 里还有 ruff棘轮/规模守卫/路由校验 三道没抄到 CI —— 两边必然漂移，
  # 且"CI 绿的本地不一定绿"。现在改为**直接调用仓库内的
  # scripts/precommit_gates.sh --all**（与本地 hook 同一份代码、同一套判定标准），
  # 单一真相源。本地 hook 现在也只是这个脚本的一层 3 行 shim。
  guards:
    name: 守卫回归 (9 道门禁全量模式)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需 + ruff)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install ruff

      # SHIGUANG_GATE_ALL=1 ⇒ 全量模式（扫全仓，而非只看暂存文件）
      # 若本机 .venv312 不存在，脚本自动回落当前 python（见 precommit_gates.sh）
      - name: 跑 9 道门禁（全量）
        run: bash scripts/precommit_gates.sh --all
        shell: bash
        env:
          SHIGUANG_GATE_ALL: "1"
          PYTHONIOENCODING: utf-8

  # ============== Job 3: 验证套件（72 项，含真起 bridge 的 e2e） ==============
  # 2026-10-09 新增：`_verify/run_all_checks.py` 是项目里最厚的一层回归（含
  # check_canvas_bridge_e2e 会真起一个 bridge 服务打 HTTP），此前**完全没进 CI**。
  verify-suite:
    name: 验证套件 (run_all_checks 72 项)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: 跑验证套件
        run: python _verify/run_all_checks.py
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen

  # ============== Job 4: 前端校验 (画布真源 tsc + vitest + 质量棘轮) ==============
  frontend-tests:
    name: 前端校验 (tsc + vitest + 质量棘轮)
    runs-on: windows-latest
    timeout-minutes: 15
    needs: unit-tests

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vendor/shiguang-canvas/package-lock.json

      - name: 安装依赖 (npm ci)
        run: npm ci
        working-directory: vendor/shiguang-canvas

      # 2026-10-09 补：tsc 与质量棘轮此前只在本地 hook 里跑，CI 完全没有。
      # tsc 基线 37 个错误全在 stage3d-core 冻结区，清零需解冻 ⇒ 先做计数棘轮。
      - name: tsc 类型检查（棘轮：错误数 ≤ 37）
        run: |
          set +e
          OUT=$(npx tsc --noEmit --pretty false 2>&1)
          N=$(printf '%s\n' "$OUT" | grep -c "error TS")
          echo "tsc 错误数：$N（基线 37）"
          if [ "$N" -gt 37 ]; then
            printf '%s\n' "$OUT" | grep "error TS" | head -20
            exit 1
          fi
        working-directory: vendor/shiguang-canvas
        shell: bash

      - name: vitest 单元测试
        run: npx vitest run --reporter=dot --pool=threads
        working-directory: vendor/shiguang-canvas
        shell: bash

      - name: 前端质量棘轮（dupNames/fnOver300/cycloOver60）
        run: |
          OUT=$(node _verify/check_canvas_frontend_quality.mjs --json)
          printf '%s' "$OUT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s).summary;const base={dupNames:8,fnOver300:10,cycloOver60:5};const bad=Object.entries(base).filter(([k,v])=>(j[k]||0)>v);if(bad.length){console.log('FAIL '+bad.map(([k,v])=>k+'='+j[k]+'>'+v).join(' '));process.exit(1)}console.log('OK dupNames='+j.dupNames+'/8 fnOver300='+j.fnOver300+'/10 cycloOver60='+j.cycloOver60+'/5')});"
        shell: bash

  # ============== Job 4: 集成测试 (秒级, Qt offscreen) ==============
  integration-tests:
    name: 集成测试 (Integration / Qt offscreen)
    runs-on: windows-latest
    timeout-minutes: 20
    needs: unit-tests  # 依赖单元测试先过

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装依赖 (必需 + 可选)
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-optional.txt
          pip install pytest playwright
          playwright install chromium

      - name: 启动 Qt6 验证 (集成)
        run: |
          cd app
          python -c "import sys; sys.path.insert(0, '.'); from PyQt6.QtCore import QT_VERSION_STR; print('Qt6:', QT_VERSION_STR)"
        shell: pwsh

      - name: 启动主程序 10 秒验证导入
        run: |
          $p = Start-Process -FilePath "python" -ArgumentList "-u","app/main_qt6.py" -PassThru -NoNewWindow -RedirectStandardOutput "app/logs/ci_run.log" -RedirectStandardError "app/logs/ci_err.log"
          Start-Sleep -Seconds 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (Test-Path "app/logs/ci_err.log") {
            $errContent = Get-Content "app/logs/ci_err.log" -Raw
            if ($errContent -match "Traceback|Error.*ModuleNotFoundError") {
              Write-Host "❌ 启动报错:" -ForegroundColor Red
              Write-Host $errContent
              exit 1
            }
          }
          Write-Host "✅ Qt6 启动无致命错误"
        shell: pwsh

      - name: 上传启动日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-startup-log
          path: |
            app/logs/ci_run.log
            app/logs/ci_err.log
          if-no-files-found: ignore

  # ============== Job 5: 打包验证 (PyInstaller smoke test) ==============
  build-smoke:
    name: 打包验证 (PyInstaller Smoke)
    runs-on: windows-latest
    timeout-minutes: 30
    needs: unit-tests
    # 仅打包保留了宽容：PyInstaller 首次跑通前受环境差异影响大；
    # 单测 / 守卫 / 前端 / 集成 四个 job 均不设 continue-on-error（真拦截）。
    continue-on-error: true

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: 安装 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: 打包 (PyInstaller)
        run: |
          cd app
          pyinstaller ai_video_editor_local.spec --noconfirm --log-level WARN
        shell: pwsh

      - name: 验证可执行文件存在
        run: |
          if (-not (Test-Path "app/dist/AI短剧编辑器/AI短剧编辑器.exe")) {
            Write-Host "❌ 打包失败: 可执行文件未生成" -ForegroundColor Red
            exit 1
          }
          $size = (Get-Item "app/dist/AI短剧编辑器/AI短剧编辑器.exe").Length
          Write-Host "✅ 打包成功: $size bytes"
        shell: pwsh

      - name: 上传打包产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ai-drama-editor-windows
          path: app/dist/
          retention-days: 7
